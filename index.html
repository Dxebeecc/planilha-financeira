<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937"/>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title>Finanças Pro - Timeline</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; scroll-behavior: smooth; }
        .card { background-color: #1e293b; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); padding: 1.5rem; border: 1px solid #334155; }
        .input-field { background-color: #0f172a; color: #f1f5f9; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem 0.8rem; width: 100%; transition: all 0.2s; }
        .input-field:focus { outline: none; border-color: #3b82f6; ring: 2px; ring-color: #3b82f6; }
        .unpaid-value { text-decoration: line-through; opacity: 0.5; }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.6rem 1.2rem; border-radius: 0.6rem; font-weight: 600; transition: all 0.2s; cursor: pointer; border: none; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; transform: translateY(-1px); }
        .btn-secondary { background-color: #334155; color: #f1f5f9; }
        .btn-secondary:hover { background-color: #475569; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-warning { background-color: #f59e0b; color: white; }

        .month-tab { position: relative; padding: 1rem; border-bottom: 3px solid transparent; transition: all 0.3s; opacity: 0.6; cursor: pointer; background: transparent; color: inherit; }
        .active-month-tab { opacity: 1; border-bottom-color: #3b82f6; background-color: rgba(59, 130, 246, 0.1); }

        .toggle-switch { position: relative; display: inline-flex; width: 44px; height: 22px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(22px); }

        .hidden-month { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <div>
                <h1 class="text-3xl font-extrabold text-white flex items-center gap-2 justify-center md:justify-start">
                    <i data-lucide="layers" class="text-blue-500"></i> Finanças Timeline
                </h1>
                <p class="text-slate-400">Controle de Fluxo Contínuo</p>
            </div>
            <div class="flex flex-wrap justify-center gap-2">
                <button onclick="advanceTimeline()" class="btn btn-primary text-sm shadow-lg shadow-blue-500/20">
                    <i data-lucide="fast-forward"></i> Encerrar Mês
                </button>
                <button onclick="openModal('backup-modal-overlay')" class="btn btn-secondary text-sm">
                    <i data-lucide="database"></i> Backup / Migrar
                </button>
            </div>
        </header>

        <!-- Dashboard -->
        <div class="card mb-8">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i data-lucide="line-chart" class="text-blue-400"></i> Panorama Semestral
            </h2>
            <div class="h-64"><canvas id="globalChart"></canvas></div>
        </div>

        <!-- Abas -->
        <div class="flex overflow-x-auto border-b border-slate-700 mb-8 no-scrollbar" id="month-tabs-container"></div>

        <!-- Conteúdo -->
        <div id="planilhas-container"></div>

        <footer class="mt-12 mb-8 border-t border-slate-700 pt-8 text-center flex flex-col md:flex-row justify-center gap-4">
            <button onclick="exportCurrentMonthCSV()" class="btn btn-success">
                <i data-lucide="file-spreadsheet"></i> Exportar Mês Atual (CSV)
            </button>
        </footer>
    </div>

    <!-- Modal Fluxo de Caixa -->
    <div id="cashflow-modal-overlay" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="card w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2" id="cashflow-title">Fluxo de Caixa</h2>
                <button onclick="closeModal('cashflow-modal-overlay')" class="p-2 hover:bg-slate-700 rounded-full"><i data-lucide="x"></i></button>
            </div>
            <div class="overflow-y-auto pr-2" id="cashflow-content"></div>
        </div>
    </div>

    <!-- Modal Backup / Migração -->
    <div id="backup-modal-overlay" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="card w-full max-w-md">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="refresh-cw"></i> Gestão de Dados</h2>
                <button onclick="closeModal('backup-modal-overlay')" class="p-2 hover:bg-slate-700 rounded-full"><i data-lucide="x"></i></button>
            </div>
            <div class="space-y-4">
                <!-- Seção de Recuperação -->
                <div class="p-4 bg-blue-500/10 border border-blue-500/30 rounded-lg">
                    <h3 class="font-bold text-blue-400 mb-1">Migrar da Planilha Antiga</h3>
                    <p class="text-xs text-slate-400 mb-3">Tenta recuperar dados das versões que não tinham botão de backup.</p>
                    <button onclick="runSmartMigration()" class="btn btn-warning w-full">
                        <i data-lucide="zap"></i> Recuperar Dados Antigos
                    </button>
                </div>

                <div class="p-4 bg-slate-800 rounded-lg">
                    <p class="text-xs text-slate-400 mb-3">Baixe o backup JSON para mover entre aparelhos.</p>
                    <button onclick="downloadBackup()" class="btn btn-primary w-full"><i data-lucide="download"></i> Baixar Backup .JSON</button>
                </div>

                <div class="p-4 bg-slate-800 rounded-lg text-center">
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="handleImport(this)">
                    <button onclick="document.getElementById('importFile').click()" class="btn btn-secondary w-full"><i data-lucide="upload"></i> Carregar Backup .JSON</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const HORA_EXTRA_RATE = 21;
        const STORAGE_KEY = 'financialDataApp_v7_timeline';
        
        let timeline = [];
        let activeIndex = 0;
        let globalChart = null;

        function initApp() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                timeline = JSON.parse(saved);
            } else {
                createDefaultTimeline();
            }
            renderTabs();
            renderMonths();
            updateChart();
            selecionarMes(0);
            lucide.createIcons();
        }

        function createDefaultTimeline() {
            const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            let startIdx = new Date().getMonth();
            timeline = [];
            for (let i = 0; i < 6; i++) {
                timeline.push({ label: monthNames[(startIdx + i) % 12], data: createEmptyMonthData() });
            }
            saveData();
        }

        function createEmptyMonthData() {
            const today = new Date().toISOString().slice(0, 10);
            return {
                incomeEntries: [
                    { id: 'saldo-' + Math.random(), name: 'Saldo Anterior', value: 0, isSystem: true, date: '' },
                    { id: Math.random(), name: 'Pagamento', value: 0, date: today },
                    { id: Math.random(), name: 'Vale', value: 0, date: today },
                    { id: Math.random(), name: 'Hora Extra', isCalculated: true, hours: 0, rate: HORA_EXTRA_RATE, date: today }
                ],
                fixedExpenses: [{ id: Math.random(), name: 'Internet', value: 0, isPaid: true, date: today }],
                variableExpenses: [{ id: Math.random(), name: 'Outros', value: 0, isPaid: true, date: today }]
            };
        }

        // --- MIGRADO INTELIGENTE (RESOLVE SEU PROBLEMA) ---
        function runSmartMigration() {
            const oldKeys = [
                'financialDataApp_semestral_v1', 
                'financialDataApp_cashflow_v1', 
                'financialDataApp_final', 
                'financialDataApp_autoSave_v2'
            ];
            
            let foundOldData = null;
            let foundLabels = null;

            for (const key of oldKeys) {
                const data = localStorage.getItem(key);
                const labels = localStorage.getItem(key.replace('financialData', 'monthLabels'));
                if (data && labels) {
                    foundOldData = JSON.parse(data);
                    foundLabels = JSON.parse(labels);
                    console.log("Dados antigos encontrados na chave:", key);
                    break;
                }
            }

            if (!foundOldData) {
                alert("Não encontrei dados de versões anteriores no seu navegador.");
                return;
            }

            if (!confirm("Encontrei dados antigos! Deseja converter e importar para a nova Timeline?\n\nIsso irá substituir os dados atuais da tela.")) return;

            try {
                const newTimeline = [];
                // As versões antigas usavam chaves 'month1', 'month2', etc.
                const monthKeys = ['month1', 'month2', 'month3', 'month4', 'month5', 'month6'];
                
                monthKeys.forEach((mKey, idx) => {
                    const oldMonth = foundOldData[mKey];
                    if (oldMonth) {
                        newTimeline.push({
                            label: foundLabels[idx] || `Mês ${idx + 1}`,
                            data: {
                                incomeEntries: oldMonth.incomeEntries.map(i => ({ ...i, id: i.id || Math.random() })),
                                // Mapeia nomes de campos antigos para novos
                                fixedExpenses: (oldMonth.fixedExpensesEntries || oldMonth.fixedExpenses || []).map(i => ({ ...i, id: i.id || Math.random() })),
                                variableExpenses: (oldMonth.variableExpensesEntries || oldMonth.variableExpenses || []).map(i => ({ ...i, id: i.id || Math.random() }))
                            }
                        });
                    }
                });

                if (newTimeline.length > 0) {
                    timeline = newTimeline;
                    saveData();
                    alert("Migração concluída com sucesso!");
                    location.reload();
                }
            } catch (err) {
                console.error(err);
                alert("Erro durante a migração. Estrutura de dados incompatível.");
            }
        }

        // --- FUNÇÕES DA PLANILHA ---
        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(timeline)); updateChart(); }
        function selecionarMes(idx) {
            activeIndex = idx;
            document.querySelectorAll('.planilha-mes-container').forEach(c => c.classList.add('hidden-month'));
            document.getElementById(`container-${idx}`).classList.remove('hidden-month');
            document.querySelectorAll('.month-tab').forEach(t => t.classList.remove('active-month-tab'));
            document.getElementById(`tab-${idx}`).classList.add('active-month-tab');
        }

        function renderTabs() {
            const container = document.getElementById('month-tabs-container');
            container.innerHTML = timeline.map((m, i) => `
                <button onclick="selecionarMes(${i})" id="tab-${i}" class="month-tab whitespace-nowrap">${m.label}</button>
            `).join('');
        }

        function renderMonths() {
            const container = document.getElementById('planilhas-container');
            container.innerHTML = timeline.map((m, i) => `
                <div id="container-${i}" class="planilha-mes-container hidden-month">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="card border-l-4 border-green-500">
                            <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="plus-circle"></i> Entradas</h3>
                            <div id="list-income-${i}" class="space-y-4"></div>
                            <button onclick="addItem(${i}, 'income')" class="btn btn-secondary btn-sm w-full mt-4">+ Adicionar</button>
                            <div class="mt-6 pt-4 border-t border-slate-700">
                                <p class="text-2xl font-black text-green-400" id="stat-inc-${i}">R$ 0,00</p>
                            </div>
                        </div>
                        <div class="lg:col-span-2 space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="card bg-red-500/5 text-center py-4">
                                    <p class="text-xs text-slate-400 font-bold uppercase">Total Pago</p>
                                    <p class="text-2xl font-black text-red-400" id="stat-exp-${i}">R$ 0,00</p>
                                </div>
                                <div class="card bg-blue-500/5 text-center py-4">
                                    <p class="text-xs text-slate-400 font-bold uppercase">Saldo</p>
                                    <p class="text-2xl font-black text-blue-400" id="stat-bal-${i}">R$ 0,00</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="card border-l-4 border-blue-500">
                                    <h4 class="font-bold mb-4">Fixas</h4>
                                    <div id="list-fixed-${i}" class="space-y-3"></div>
                                    <button onclick="addItem(${i}, 'fixed')" class="btn btn-secondary btn-sm w-full mt-4">+ Adicionar</button>
                                </div>
                                <div class="card border-l-4 border-orange-500">
                                    <h4 class="font-bold mb-4">Variáveis</h4>
                                    <div id="list-variable-${i}" class="space-y-3"></div>
                                    <button onclick="addItem(${i}, 'variable')" class="btn btn-secondary btn-sm w-full mt-4">+ Adicionar</button>
                                </div>
                            </div>
                            <div class="flex justify-center"><button onclick="showCashFlow(${i})" class="btn btn-primary px-10">Ver Fluxo de Caixa</button></div>
                        </div>
                    </div>
                </div>
            `).join('');
            renderAllLists();
        }

        function renderAllLists() {
            timeline.forEach((m, i) => {
                renderItemList(i, 'income', m.data.incomeEntries);
                renderItemList(i, 'fixed', m.data.fixedExpenses);
                renderItemList(i, 'variable', m.data.variableExpenses);
                updateStats(i);
            });
            lucide.createIcons();
        }

        function renderItemList(mIdx, type, items) {
            const container = document.getElementById(`list-${type}-${mIdx}`);
            if (!container) return;
            container.innerHTML = items.map(item => `
                <div class="p-3 bg-slate-800/40 rounded-lg border border-slate-700">
                    <div class="flex justify-between items-center mb-2 gap-2">
                        <input type="text" value="${item.name}" class="bg-transparent border-none text-sm font-semibold w-full focus:ring-0" onchange="updateProp(${mIdx},'${type}','${item.id}','name',this.value)" ${item.isSystem?'readonly':''}>
                        ${!item.isSystem ? `<button onclick="removeItem(${mIdx},'${type}','${item.id}')" class="text-slate-500 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="date" value="${item.date||''}" class="input-field text-xs p-1 h-9 w-32" onchange="updateProp(${mIdx},'${type}','${item.id}','date',this.value)">
                        <input type="number" step="0.01" value="${item.isCalculated? (item.hours*item.rate) : item.value||0}" class="input-field text-sm ${item.isPaid===false?'unpaid-value':''}" onchange="updateValue(${mIdx},'${type}','${item.id}',this.value)" ${item.isCalculated||item.isSystem?'readonly':''}>
                        ${item.isPaid!==undefined? `<label class="toggle-switch"><input type="checkbox" ${item.isPaid?'checked':''} onchange="togglePaid(${mIdx},'${type}','${item.id}')"><span class="slider"></span></label>`:''}
                    </div>
                </div>
            `).join('');
        }

        function updateProp(mIdx,type,id,prop,val) {
            const list = getL(mIdx,type); const item = list.find(i=>i.id==id);
            if(item) { item[prop]=val; saveData(); renderAllLists(); }
        }
        function updateValue(mIdx,type,id,val) {
            const list = getL(mIdx,type); const item = list.find(i=>i.id==id);
            if(item) { item.value=parseFloat(val)||0; saveData(); propagateBalances(); renderAllLists(); }
        }
        function togglePaid(mIdx,type,id) {
            const list = getL(mIdx,type); const item = list.find(i=>i.id==id);
            if(item) { item.isPaid=!item.isPaid; saveData(); propagateBalances(); renderAllLists(); }
        }
        function addItem(mIdx,type) {
            const list = getL(mIdx,type);
            list.push({ id: Math.random(), name: 'Novo Item', value: 0, date: new Date().toISOString().slice(0,10), isPaid: type!=='income' });
            saveData(); renderAllLists();
        }
        function removeItem(mIdx,type,id) {
            const key = type==='income'?'incomeEntries':(type==='fixed'?'fixedExpenses':'variableExpenses');
            timeline[mIdx].data[key] = timeline[mIdx].data[key].filter(i=>i.id!=id);
            saveData(); propagateBalances(); renderAllLists();
        }
        function getL(mIdx,type) { 
            const d = timeline[mIdx].data;
            return type==='income'?d.incomeEntries:(type==='fixed'?d.fixedExpenses:d.variableExpenses);
        }

        function propagateBalances() {
            for (let i = 0; i < timeline.length - 1; i++) {
                const t = calculateTotalsForData(timeline[i].data);
                let s = timeline[i+1].data.incomeEntries.find(e => e.isSystem);
                if(s) s.value = t.balance;
            }
        }

        function calculateTotalsForData(d) {
            const inc = d.incomeEntries.reduce((s, i) => s + (i.isCalculated ? (i.hours * i.rate) : (i.value || 0)), 0);
            const expF = d.fixedExpenses.reduce((s, i) => s + (i.isPaid ? i.value : 0), 0);
            const expV = d.variableExpenses.reduce((s, i) => s + (i.isPaid ? i.value : 0), 0);
            return { inc, exp: expF+expV, balance: inc - (expF+expV) };
        }

        function updateStats(mIdx) {
            const t = calculateTotalsForData(timeline[mIdx].data);
            document.getElementById(`stat-inc-${mIdx}`).textContent = formatBRL(t.inc);
            document.getElementById(`stat-exp-${mIdx}`).textContent = formatBRL(t.exp);
            const b = document.getElementById(`stat-bal-${mIdx}`);
            b.textContent = formatBRL(t.balance);
            b.className = `text-2xl font-black ${t.balance>=0?'text-blue-400':'text-red-400'}`;
        }

        function formatBRL(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function openModal(id) { document.getElementById(id).style.display='flex'; }
        function closeModal(id) { document.getElementById(id).style.display='none'; }

        function downloadBackup() {
            const blob = new Blob([JSON.stringify(timeline)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `backup_timeline.json`; a.click();
        }
        function handleImport(input) {
            const r = new FileReader(); r.onload = e => { 
                timeline = JSON.parse(e.target.result); saveData(); location.reload();
            }; r.readAsText(input.files[0]);
        }

        function advanceTimeline() {
            if(!confirm("Encerrar este mês?")) return;
            timeline.shift();
            const names = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
            const last = timeline[timeline.length-1].label;
            timeline.push({ label: `Mês Novo`, data: createEmptyMonthData() });
            saveData(); propagateBalances(); location.reload();
        }

        function updateChart() {
            const ctx = document.getElementById('globalChart').getContext('2d');
            const incs = timeline.map(m => calculateTotalsForData(m.data).inc);
            const exps = timeline.map(m => calculateTotalsForData(m.data).exp);
            if(globalChart) globalChart.destroy();
            globalChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: timeline.map(m=>m.label),
                    datasets: [{ label: 'Ganhos', data: incs, backgroundColor: '#10b981' }, { label: 'Gastos', data: exps, backgroundColor: '#ef4444' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function showCashFlow(idx) {
            const m = timeline[idx];
            const entries = [
                ...m.data.incomeEntries.map(i => ({ ...i, val: i.isCalculated?i.hours*i.rate:i.value, type:'IN' })),
                ...m.data.fixedExpenses.filter(e=>e.isPaid).map(i => ({ ...i, val: -i.value, type:'OUT' })),
                ...m.data.variableExpenses.filter(e=>e.isPaid).map(i => ({ ...i, val: -i.value, type:'OUT' }))
            ].sort((a,b) => new Date(a.date||'9999') - new Date(b.date||'9999'));
            let run = 0;
            document.getElementById('cashflow-content').innerHTML = `
                <table class="w-full text-left">
                    <thead><tr class="text-xs uppercase text-slate-500"><th>Data</th><th>Item</th><th class="text-right">Valor</th><th class="text-right">Saldo</th></tr></thead>
                    <tbody>${entries.map(e=>{ run+=e.val; return `<tr class="border-b border-slate-700 text-sm"><td class="py-2">${e.date||'-'}</td><td>${e.name}</td><td class="text-right ${e.type==='IN'?'text-green-400':'text-red-400'}">${formatBRL(e.val)}</td><td class="text-right font-bold">${formatBRL(run)}</td></tr>`}).join('')}</tbody>
                </table>`;
            openModal('cashflow-modal-overlay');
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>

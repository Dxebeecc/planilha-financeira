<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937"/>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title id="page-title">Finanças Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; scroll-behavior: smooth; }
        .card { background-color: #1e293b; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); padding: 1.5rem; border: 1px solid #334155; }
        .input-field { background-color: #0f172a; color: #f1f5f9; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem 0.8rem; width: 100%; transition: all 0.2s; font-size: 0.875rem; }
        .input-field:focus { outline: none; border-color: #3b82f6; ring: 2px; ring-color: #3b82f6; }
        
        /* LOGICA VISUAL DE PAGAMENTO */
        .item-row { transition: all 0.2s ease; border-width: 2px; border-style: solid; }
        .item-paid { background-color: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.4) !important; }
        .item-paid .main-text, .item-paid input { color: #10b981 !important; }
        .item-unpaid { background-color: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.4) !important; }
        .item-unpaid .main-text, .item-unpaid input { color: #ef4444 !important; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem 1rem; border-radius: 0.6rem; font-weight: 600; transition: all 0.2s; cursor: pointer; border: none; font-size: 0.8rem; white-space: nowrap; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; transform: translateY(-1px); }
        .btn-secondary { background-color: #334155; color: #f1f5f9; }
        .btn-success { background-color: #10b981; color: white; }

        /* Floating Button */
        .fab { position: fixed; bottom: 1.5rem; right: 1.5rem; width: 3.5rem; height: 3.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: #3b82f6; color: white; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5); cursor: pointer; z-index: 40; transition: transform 0.2s; }
        .fab:hover { transform: scale(1.1); }

        .month-tab { position: relative; padding: 1rem; border-bottom: 3px solid transparent; transition: all 0.3s; opacity: 0.6; cursor: pointer; background: transparent; color: inherit; font-weight: 600; }
        .active-month-tab { opacity: 1; border-bottom-color: #3b82f6; background-color: rgba(59, 130, 246, 0.1); }
        
        .add-month-btn { padding: 0 1.2rem; color: #94a3b8; transition: color 0.2s; border-left: 1px solid #334155; cursor: pointer; }
        .add-month-btn:hover { color: #3b82f6; }

        .toggle-switch { position: relative; display: inline-flex; width: 42px; height: 20px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(22px); }

        .hidden-month { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .modal-overlay { position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.85); z-index: 50; display: none; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px); }

        /* Estilo para Título Editável */
        .editable-title-container { cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .editable-title-container:hover { opacity: 0.8; }
        .editable-title-container i { opacity: 0; transition: opacity 0.2s; }
        .editable-title-container:hover i { opacity: 1; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto pb-24">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="editable-title-container" onclick="editAppTitle()">
                <h1 id="app-display-title" class="text-3xl font-extrabold text-white">Finanças Pro</h1>
                <i data-lucide="pencil" class="w-5 h-5 text-blue-400"></i>
            </div>
            <div class="flex flex-row items-center gap-2">
                <button onclick="advanceTimeline()" class="btn btn-primary shadow-lg shadow-blue-500/20">
                    <i data-lucide="fast-forward" class="w-4 h-4"></i> Encerrar Mês
                </button>
                <button onclick="openModal('backup-modal-overlay')" class="btn btn-secondary">
                    <i data-lucide="database" class="w-4 h-4"></i> Backup
                </button>
            </div>
        </header>

        <!-- Navegação de Meses -->
        <div class="flex items-center border-b border-slate-700 mb-8 overflow-hidden bg-slate-900/30 rounded-t-lg">
            <div class="flex overflow-x-auto no-scrollbar flex-grow" id="month-tabs-container"></div>
            <div onclick="addNewMonthManual()" class="add-month-btn" title="Adicionar Mês">
                <i data-lucide="plus-circle" class="w-6 h-6"></i>
            </div>
        </div>

        <div id="planilhas-container"></div>

        <footer class="mt-12 border-t border-slate-700 pt-8 text-center">
            <button onclick="exportCurrentMonthCSV()" class="btn btn-success">
                <i data-lucide="file-spreadsheet"></i> Exportar este Mês (CSV)
            </button>
        </footer>
    </div>

    <!-- Floating Chart Button -->
    <div class="fab" onclick="openChartModal()">
        <i data-lucide="bar-chart-3"></i>
    </div>

    <!-- Modais -->
    <div id="chart-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-5xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="line-chart" class="text-blue-400"></i> Evolução Financeira</h2>
                <button onclick="closeModal('chart-modal-overlay')" class="p-2 hover:bg-slate-700 rounded-full"><i data-lucide="x"></i></button>
            </div>
            <div class="h-[60vh] md:h-[50vh]"><canvas id="globalChart"></canvas></div>
        </div>
    </div>

    <div id="cashflow-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold" id="cashflow-title">Fluxo de Caixa</h2>
                <button onclick="closeModal('cashflow-modal-overlay')" class="p-2 hover:bg-slate-700 rounded-full"><i data-lucide="x"></i></button>
            </div>
            <div class="overflow-y-auto pr-2" id="cashflow-content"></div>
        </div>
    </div>

    <div id="backup-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-md">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="settings"></i> Dados</h2>
                <button onclick="closeModal('backup-modal-overlay')" class="p-2 hover:bg-slate-700 rounded-full"><i data-lucide="x"></i></button>
            </div>
            <div class="space-y-4">
                <div class="p-4 bg-blue-500/10 border border-blue-500/30 rounded-lg">
                    <button onclick="runSmartMigration()" class="btn btn-warning w-full"><i data-lucide="zap"></i> Migrar Histórico</button>
                </div>
                <button onclick="downloadBackup()" class="btn btn-primary w-full"><i data-lucide="download"></i> Baixar Arquivo .JSON</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="handleImport(this)">
                <button onclick="document.getElementById('importFile').click()" class="btn btn-secondary w-full"><i data-lucide="upload"></i> Carregar Arquivo .JSON</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-sm text-center">
            <h3 class="text-xl font-bold mb-4" id="confirm-title">Atenção</h3>
            <p class="text-slate-400 mb-6" id="confirm-body"></p>
            <div class="flex justify-center gap-4">
                <button id="confirm-btn-yes" class="btn btn-primary px-8">Confirmar</button>
                <button onclick="closeModal('confirm-modal-overlay')" class="btn btn-secondary px-8">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const HORA_EXTRA_RATE = 21;
        const STORAGE_KEY = 'financialDataApp_v15_final';
        const TITLE_KEY = 'financialApp_customTitle';
        const MONTH_NAMES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        
        let timeline = [];
        let activeIndex = 0;
        let globalChart = null;

        function initApp() {
            // Carregar Título
            const savedTitle = localStorage.getItem(TITLE_KEY);
            if (savedTitle) {
                document.getElementById('app-display-title').innerText = savedTitle;
                document.getElementById('page-title').innerText = savedTitle;
            }

            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                timeline = JSON.parse(saved);
            } else {
                createDefaultTimeline();
            }
            renderAll();
            selecionarMes(0);
        }

        // FUNÇÃO PARA EDITAR TÍTULO
        function editAppTitle() {
            const current = document.getElementById('app-display-title').innerText;
            const nuevo = prompt("Como você quer chamar sua planilha?", current);
            if (nuevo && nuevo.trim() !== "") {
                const cleanName = nuevo.trim();
                document.getElementById('app-display-title').innerText = cleanName;
                document.getElementById('page-title').innerText = cleanName;
                localStorage.setItem(TITLE_KEY, cleanName);
            }
        }

        function createDefaultTimeline() {
            let startIdx = new Date().getMonth();
            timeline = [];
            for (let i = 0; i < 6; i++) {
                timeline.push({ label: MONTH_NAMES[(startIdx + i) % 12], data: createEmptyMonthData() });
            }
            saveData();
        }

        function createEmptyMonthData() {
            const today = new Date().toISOString().slice(0, 10);
            return {
                incomeEntries: [
                    { id: 'saldo-' + Math.random(), name: 'Saldo Anterior', value: 0, isSystem: true, date: '' },
                    { id: Math.random(), name: 'Salário', value: 0, date: today },
                    { id: Math.random(), name: 'Vale', value: 0, date: today },
                    { id: Math.random(), name: 'Hora Extra', isCalculated: true, hours: 0, rate: HORA_EXTRA_RATE, date: today }
                ],
                fixedExpenses: [{ id: Math.random(), name: 'Internet/Aluguel', value: 0, isPaid: false, date: today }],
                variableExpenses: [{ id: Math.random(), name: 'Mercado/Outros', value: 0, isPaid: false, date: today }]
            };
        }

        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(timeline)); }

        function renderAll() {
            renderTabs();
            renderMonths();
            lucide.createIcons();
        }

        function renderTabs() {
            const container = document.getElementById('month-tabs-container');
            container.innerHTML = timeline.map((m, i) => {
                const unpaid = [...m.data.fixedExpenses, ...m.data.variableExpenses].filter(e => !e.isPaid).length;
                return `
                <button onclick="selecionarMes(${i})" id="tab-${i}" class="month-tab whitespace-nowrap flex items-center gap-2">
                    ${m.label}
                    ${unpaid > 0 ? `<span class="bg-red-500 text-[10px] text-white px-1.5 py-0.5 rounded-full font-black">${unpaid}</span>` : ''}
                </button>
                `}).join('');
        }

        function renderMonths() {
            const container = document.getElementById('planilhas-container');
            container.innerHTML = timeline.map((m, i) => `
                <div id="container-${i}" class="planilha-mes-container hidden-month space-y-6">
                    
                    <!-- PERFORMANCE -->
                    <div class="card bg-slate-800/40 border-blue-500/20">
                        <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                            <div class="flex-grow w-full">
                                <h4 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3"> Resumo: ${m.label}</h4>
                                <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden">
                                    <div id="prog-paid-${i}" class="bg-green-500 h-full transition-all duration-700" style="width: 0%"></div>
                                </div>
                                <div class="flex justify-between mt-2">
                                    <span class="text-xs text-slate-500 font-bold" id="txt-prog-${i}">0% pago</span>
                                    <button onclick="showCashFlow(${i})" class="text-xs text-blue-400 hover:text-white flex items-center gap-1">
                                        <i data-lucide="calendar" class="w-3 h-3"></i> Analisar Fluxo
                                    </button>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-4 w-full md:w-auto">
                                <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700 text-center">
                                    <p class="text-[10px] text-slate-500 uppercase font-bold">Pago</p>
                                    <p class="text-lg font-black text-green-400" id="stat-paid-${i}">R$ 0</p>
                                </div>
                                <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700 text-center">
                                    <p class="text-[10px] text-slate-500 uppercase font-bold">Livre</p>
                                    <p class="text-lg font-black text-blue-400" id="stat-bal-${i}">R$ 0</p>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6 pt-6 border-t border-slate-700/30 text-center">
                            <div><p class="text-[10px] text-slate-500 uppercase font-bold">Fixas</p><p class="text-sm font-bold text-blue-300" id="det-fix-${i}">R$ 0</p></div>
                            <div><p class="text-[10px] text-slate-500 uppercase font-bold">Variáveis</p><p class="text-sm font-bold text-orange-300" id="det-var-${i}">R$ 0</p></div>
                            <div><p class="text-[10px] text-slate-500 uppercase font-bold text-red-400">Pendente</p><p class="text-sm font-bold text-red-500" id="det-pend-${i}">R$ 0</p></div>
                            <div><p class="text-[10px] text-slate-500 uppercase font-bold">Total Mês</p><p class="text-sm font-bold text-white" id="det-tot-${i}">R$ 0</p></div>
                        </div>
                    </div>

                    <!-- DADOS -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        <div class="card border-l-4 border-green-500 h-fit">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-lg font-bold flex items-center gap-2 text-green-400"><i data-lucide="arrow-down-circle"></i> Entradas</h3>
                                ${i > 0 ? `<button onclick="copyPrevStructure(${i}, 'income')" class="text-slate-500 hover:text-green-400 transition-colors"><i data-lucide="copy" class="w-4 h-4"></i></button>` : ''}
                            </div>
                            <div id="list-income-${i}" class="space-y-3"></div>
                            <button onclick="addItem(${i}, 'income')" class="btn btn-secondary btn-sm w-full mt-6">+ Nova Entrada</button>
                            <div class="mt-4 pt-4 border-t border-slate-800 flex justify-between items-center">
                                <span class="text-xs text-slate-500 font-bold uppercase">Total Bruto</span>
                                <span class="text-xl font-black text-green-400" id="stat-inc-${i}">R$ 0</span>
                            </div>
                        </div>

                        <div class="card border-l-4 border-blue-500 h-fit">
                            <div class="flex justify-between items-center mb-6">
                                <h4 class="text-lg font-bold flex items-center gap-2 text-blue-400"><i data-lucide="lock"></i> Fixas</h4>
                                ${i > 0 ? `<button onclick="copyPrevStructure(${i}, 'fixed')" class="text-slate-500 hover:text-blue-400 transition-colors"><i data-lucide="copy" class="w-4 h-4"></i></button>` : ''}
                            </div>
                            <div id="list-fixed-${i}" class="space-y-3"></div>
                            <button onclick="addItem(${i}, 'fixed')" class="btn btn-secondary btn-sm w-full mt-6">+ Adicionar Fixa</button>
                        </div>

                        <div class="card border-l-4 border-orange-500 h-fit">
                            <div class="flex justify-between items-center mb-6">
                                <h4 class="text-lg font-bold flex items-center gap-2 text-orange-400"><i data-lucide="shopping-bag"></i> Variáveis</h4>
                                ${i > 0 ? `<button onclick="copyPrevStructure(${i}, 'variable')" class="text-slate-500 hover:text-orange-400 transition-colors"><i data-lucide="copy" class="w-4 h-4"></i></button>` : ''}
                            </div>
                            <div id="list-variable-${i}" class="space-y-3"></div>
                            <button onclick="addItem(${i}, 'variable')" class="btn btn-secondary btn-sm w-full mt-6">+ Adicionar Variável</button>
                        </div>

                    </div>
                </div>
            `).join('');
            timeline.forEach((_, idx) => renderMonthLists(idx));
        }

        function renderMonthLists(mIdx) {
            renderItemList(mIdx, 'income', timeline[mIdx].data.incomeEntries);
            renderItemList(mIdx, 'fixed', timeline[mIdx].data.fixedExpenses);
            renderItemList(mIdx, 'variable', timeline[mIdx].data.variableExpenses);
            updateStats(mIdx);
        }

        function renderItemList(mIdx, type, items) {
            const container = document.getElementById(`list-${type}-${mIdx}`);
            if (!container) return;
            container.innerHTML = items.map(item => {
                const isPaid = item.isPaid !== undefined ? item.isPaid : true;
                const statusClass = isPaid ? 'item-paid' : 'item-unpaid';
                let valDisplay = `<input type="number" step="0.01" value="${item.value || 0}" class="input-field text-sm w-full" onchange="updateValue(${mIdx},'${type}','${item.id}',this.value)" ${item.isCalculated || item.isSystem ? 'readonly' : ''}>`;
                
                if (item.isCalculated) {
                    const total = (item.hours || 0) * (item.rate || 0);
                    valDisplay = `<div class="flex gap-1"><input type="number" value="${item.hours || 0}" class="input-field text-xs w-12" onchange="updateProp(${mIdx},'income','${item.id}','hours',this.value)"><div class="input-field text-xs bg-slate-800 flex items-center justify-center font-bold min-w-[70px]">R$ ${total}</div></div>`;
                }

                return `
                <div class="p-3 rounded-lg item-row ${statusClass}">
                    <div class="flex justify-between items-center mb-2 gap-2">
                        <input type="text" value="${item.name}" class="main-text bg-transparent border-none text-sm font-bold w-full focus:ring-0 truncate" onchange="updateProp(${mIdx},'${type}','${item.id}','name',this.value)" ${item.isSystem?'readonly':''}>
                        ${!item.isSystem ? `<button onclick="removeItem(${mIdx},'${type}','${item.id}')" class="text-slate-500 hover:text-red-500 transition-colors"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="date" value="${item.date||''}" class="input-field text-[10px] p-1 h-9 w-28" onchange="updateProp(${mIdx},'${type}','${item.id}','date',this.value)">
                        <div class="flex-grow">${valDisplay}</div>
                        ${item.isPaid!==undefined? `<label class="toggle-switch"><input type="checkbox" ${isPaid?'checked':''} onchange="togglePaid(${mIdx},'${type}','${item.id}')"><span class="slider"></span></label>`:''}
                    </div>
                </div>`}).join('');
        }

        // --- CORE ---
        function updateProp(mIdx,type,id,p,v) { 
            const l = getL(mIdx,type); const i = l.find(x=>x.id==id); 
            if(i){ i[p]=(p==='hours'?parseFloat(v):v); saveData(); renderMonthLists(mIdx); }
        }
        function updateValue(mIdx,type,id,v) {
            const l = getL(mIdx,type); const i = l.find(x=>x.id==id);
            if(i){ i.value=parseFloat(v)||0; saveData(); propagateBalances(); timeline.forEach((_, idx) => updateStats(idx)); renderMonthLists(mIdx); }
        }
        function togglePaid(mIdx,type,id) {
            const l = getL(mIdx,type); const i = l.find(x=>x.id==id);
            if(i){ i.isPaid=!i.isPaid; saveData(); propagateBalances(); renderMonthLists(mIdx); renderTabs(); }
        }
        function addItem(mIdx,type) {
            const l = getL(mIdx,type);
            l.push({ id: Math.random(), name: 'Novo Item', value: 0, date: new Date().toISOString().slice(0,10), isPaid: false });
            saveData(); renderMonthLists(mIdx); renderTabs(); lucide.createIcons();
        }
        function removeItem(mIdx,type,id) {
            customConfirm("Excluir item?", "Este item será removido permanentemente.", () => {
                const key = type==='income'?'incomeEntries':(type==='fixed'?'fixedExpenses':'variableExpenses');
                timeline[mIdx].data[key] = timeline[mIdx].data[key].filter(x=>x.id!=id);
                saveData(); propagateBalances(); renderMonthLists(mIdx); renderTabs(); lucide.createIcons();
            });
        }
        function getL(mIdx,type) { 
            const d = timeline[mIdx].data;
            return type==='income'?d.incomeEntries:(type==='fixed'?d.fixedExpenses:d.variableExpenses);
        }

        function copyPrevStructure(mIdx, type) {
            if (mIdx === 0) return;
            const key = type === 'income' ? 'incomeEntries' : (type === 'fixed' ? 'fixedExpenses' : 'variableExpenses');
            const prevData = JSON.parse(JSON.stringify(timeline[mIdx-1].data[key]));
            const cleanData = prevData.filter(x => !x.isSystem).map(item => {
                item.id = Math.random();
                item.isPaid = false;
                return item;
            });
            if (type === 'income') {
                const currentSaldo = timeline[mIdx].data.incomeEntries.find(x => x.isSystem);
                timeline[mIdx].data.incomeEntries = [currentSaldo, ...cleanData];
            } else if (type === 'fixed') {
                timeline[mIdx].data.fixedExpenses = cleanData;
            } else {
                timeline[mIdx].data.variableExpenses = cleanData;
            }
            saveData(); propagateBalances(); renderMonthLists(mIdx); renderTabs(); lucide.createIcons();
        }

        function propagateBalances() {
            for (let i = 0; i < timeline.length - 1; i++) {
                const t = calculateTotalsForData(timeline[i].data);
                let s = timeline[i+1].data.incomeEntries.find(x => x.isSystem);
                if(s) s.value = t.balance;
            }
        }

        function calculateTotalsForData(d) {
            const inc = d.incomeEntries.reduce((s, x) => s + (x.isCalculated ? (x.hours * x.rate) : (x.value || 0)), 0);
            const fixP = d.fixedExpenses.reduce((s, x) => s + (x.isPaid ? x.value : 0), 0);
            const fixT = d.fixedExpenses.reduce((s, x) => s + (x.value || 0), 0);
            const varP = d.variableExpenses.reduce((s, x) => s + (x.isPaid ? x.value : 0), 0);
            const varT = d.variableExpenses.reduce((s, x) => s + (x.value || 0), 0);
            return { inc, fixP, fixT, varP, varT, totalP: fixP + varP, totalT: fixT + varT, balance: inc - (fixP + varP) };
        }

        function updateStats(mIdx) {
            const t = calculateTotalsForData(timeline[mIdx].data);
            const elInc = document.getElementById(`stat-inc-${mIdx}`); if(elInc) elInc.textContent = formatBRL(t.inc);
            const elPaid = document.getElementById(`stat-paid-${mIdx}`); if(elPaid) elPaid.textContent = formatBRL(t.totalP);
            const elBal = document.getElementById(`stat-bal-${mIdx}`);
            if(elBal) {
                elBal.textContent = formatBRL(t.balance);
                elBal.className = `text-lg font-black ${t.balance>=0?'text-blue-400':'text-red-400'}`;
            }

            const elFix = document.getElementById(`det-fix-${mIdx}`); if(elFix) elFix.textContent = formatBRL(t.fixT);
            const elVar = document.getElementById(`det-var-${mIdx}`); if(elVar) elVar.textContent = formatBRL(t.varT);
            const elPend = document.getElementById(`det-pend-${mIdx}`); if(elPend) elPend.textContent = formatBRL(t.totalT - t.totalP);
            const elTot = document.getElementById(`det-tot-${mIdx}`); if(elTot) elTot.textContent = formatBRL(t.totalT);
            
            const prog = t.totalT > 0 ? (t.totalP / t.totalT * 100).toFixed(0) : 0;
            const elBar = document.getElementById(`prog-paid-${mIdx}`); if(elBar) elBar.style.width = prog + '%';
            const elTxt = document.getElementById(`txt-prog-${mIdx}`); if(elTxt) elTxt.textContent = prog + '% pago';
        }

        // --- UI & TIMELINE ---
        function addNewMonthManual() {
            const last = timeline[timeline.length - 1].label;
            const nextIdx = (MONTH_NAMES.indexOf(last) + 1) % 12;
            timeline.push({ label: MONTH_NAMES[nextIdx], data: createEmptyMonthData() });
            propagateBalances(); saveData(); renderAll(); selecionarMes(timeline.length - 1);
            setTimeout(() => {
                const tabs = document.getElementById('month-tabs-container');
                tabs.scrollTo({ left: tabs.scrollWidth, behavior: 'smooth' });
            }, 100);
        }

        function advanceTimeline() {
            customConfirm("Encerrar este mês?", "O primeiro mês será removido definitivamente.", () => {
                timeline.shift();
                if (timeline.length < 1) createDefaultTimeline();
                else {
                    const last = timeline[timeline.length - 1].label;
                    const nextIdx = (MONTH_NAMES.indexOf(last) + 1) % 12;
                    timeline.push({ label: MONTH_NAMES[nextIdx], data: createEmptyMonthData() });
                }
                saveData(); propagateBalances(); location.reload();
            });
        }

        function selecionarMes(idx) {
            activeIndex = idx;
            document.querySelectorAll('.planilha-mes-container').forEach(c => c.classList.add('hidden-month'));
            document.getElementById(`container-${idx}`).classList.remove('hidden-month');
            document.querySelectorAll('.month-tab').forEach(t => t.classList.remove('active-month-tab'));
            document.getElementById(`tab-${idx}`).classList.add('active-month-tab');
        }

        function openModal(id) { document.getElementById(id).style.display='flex'; lucide.createIcons(); }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        function openChartModal() { openModal('chart-modal-overlay'); setTimeout(updateChart, 100); }
        function customConfirm(title, body, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-body').innerText = body;
            const btn = document.getElementById('confirm-btn-yes');
            btn.onclick = () => { closeModal('confirm-modal-overlay'); callback(); };
            openModal('confirm-modal-overlay');
        }

        function formatBRL(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

        function downloadBackup() {
            const blob = new Blob([JSON.stringify(timeline)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `backup_timeline_v15.json`; a.click();
        }

        function handleImport(input) {
            const r = new FileReader(); r.onload = e => { 
                try {
                    timeline = JSON.parse(e.target.result); saveData(); location.reload();
                } catch(e) { alert("Inválido."); }
            }; r.readAsText(input.files[0]);
        }

        function runSmartMigration() {
            const keys = ['financialDataApp_v14_final','financialDataApp_v13_colors','financialDataApp_v12_flex'];
            let found = null; for(let k of keys){ const d = localStorage.getItem(k); if(d){ found=JSON.parse(d); break; } }
            if(!found) return alert("Nada encontrado.");
            timeline = Array.isArray(found) ? found : Object.values(found);
            saveData(); location.reload();
        }

        function updateChart() {
            const ctx = document.getElementById('globalChart').getContext('2d');
            const incs = timeline.map(m => calculateTotalsForData(m.data).inc);
            const exps = timeline.map(m => calculateTotalsForData(m.data).totalT);
            if(globalChart) globalChart.destroy();
            globalChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: timeline.map(m=>m.label),
                    datasets: [{ label: 'Renda', data: incs, backgroundColor: '#3b82f6', borderRadius: 4 }, { label: 'Custos', data: exps, backgroundColor: '#ef4444', borderRadius: 4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }, x: { grid: { display: false }, ticks: { color: '#94a3b8' } } }, plugins: { legend: { labels: { color: '#f1f5f9' } } } }
            });
        }

        function showCashFlow(idx) {
            const m = timeline[idx];
            const entries = [
                ...m.data.incomeEntries.map(i => ({ ...i, val: i.isCalculated?i.hours*i.rate:i.value, type:'IN' })),
                ...m.data.fixedExpenses.filter(e=>e.isPaid).map(i => ({ ...i, val: -i.value, type:'OUT' })),
                ...m.data.variableExpenses.filter(e=>e.isPaid).map(i => ({ ...i, val: -i.value, type:'OUT' }))
            ].sort((a,b) => new Date(a.date||'9999-12-31') - new Date(b.date||'9999-12-31'));
            let run = 0;
            document.getElementById('cashflow-content').innerHTML = `
                <table class="w-full text-left">
                    <thead class="sticky top-0 bg-slate-800 text-xs uppercase text-slate-500"><tr><th class="p-2">Data</th><th>Descrição</th><th class="text-right">Valor</th><th class="text-right p-2">Saldo</th></tr></thead>
                    <tbody>${entries.map(e=>{ run+=e.val; return `<tr class="border-b border-slate-700/50 text-sm"><td class="p-2 text-slate-500">${e.date?new Date(e.date+'T00:00:00').toLocaleDateString('pt-BR'):'-'}</td><td class="font-bold">${e.name}</td><td class="text-right ${e.type==='IN'?'text-green-400':'text-red-400'}">${formatBRL(e.val)}</td><td class="text-right font-black p-2 ${run<0?'text-red-500':'text-blue-400'}">${formatBRL(run)}</td></tr>`}).join('')}</tbody>
                </table>`;
            openModal('cashflow-modal-overlay');
        }

        function exportCurrentMonthCSV() {
            const m = timeline[activeIndex];
            let csv = "Tipo;Data;Descricao;Valor;Status\n";
            const add = (t, l) => l.forEach(i => csv += `${t};${i.date || ''};${i.name};${i.isCalculated ? i.hours*i.rate : i.value};${i.isPaid === false ? 'Pendente' : 'Pago'}\n`);
            add('Entrada', m.data.incomeEntries); add('Fixa', m.data.fixedExpenses); add('Variavel', m.data.variableExpenses);
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            a.download = `financeiro_${m.label.toLowerCase()}.csv`; a.click();
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>

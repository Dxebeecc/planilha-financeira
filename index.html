<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a"/>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title id="page-title">Finanças Pro v31</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        .card { background-color: #1e293b; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2); padding: 1.25rem; border: 1px solid #334155; }
        .input-field { background-color: #0f172a; color: #f1f5f9; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem 0.8rem; width: 100%; transition: all 0.2s; font-size: 0.875rem; }
        .input-field:focus { border-color: #3b82f6; outline: none; ring: 2px; ring-color: #3b82f6; }
        
        /* CORES DE STATUS */
        .item-row { transition: all 0.2s ease; border-width: 2px; border-style: solid; position: relative; }
        .item-paid { background-color: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.3) !important; }
        .item-paid .main-text, .item-paid input { color: #10b981 !important; }
        .item-unpaid { background-color: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.3) !important; }
        .item-unpaid .main-text, .item-unpaid input { color: #ef4444 !important; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem 1rem; border-radius: 0.6rem; font-weight: 600; transition: all 0.2s; cursor: pointer; border: none; font-size: 0.8rem; white-space: nowrap; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-secondary { background-color: #334155; color: #f1f5f9; }
        .btn-warning { background-color: #f59e0b; color: white; }

        .fab { position: fixed; bottom: 1.5rem; right: 1.5rem; width: 3.5rem; height: 3.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: #3b82f6; color: white; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5); cursor: pointer; z-index: 40; }

        .month-tab { position: relative; padding: 1rem; border-bottom: 3px solid transparent; transition: all 0.3s; opacity: 0.6; cursor: pointer; background: transparent; color: inherit; font-weight: 600; white-space: nowrap; }
        .active-month-tab { opacity: 1 !important; border-bottom-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.1); }
        
        .toggle-switch { position: relative; display: inline-flex; width: 42px; height: 20px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn-remove { position: absolute; top: 0.5rem; right: 0.5rem; color: #64748b; padding: 2px; cursor: pointer; z-index: 10; }
        .btn-remove:hover { color: #ef4444; }

        .btn-sync { position: absolute; top: 0.5rem; right: 2rem; color: #3b82f6; padding: 2px; cursor: pointer; z-index: 10; opacity: 0.4; }
        .btn-sync:hover { opacity: 1; }
        
        .planilha-mes-container { display: none; }
        .active-month-container { display: block !important; }

        .modal-overlay { position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.85); z-index: 50; display: none; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        #save-indicator { position: fixed; top: 1rem; right: 1rem; padding: 0.4rem 0.8rem; border-radius: 2rem; background: #10b981; color: white; font-size: 0.7rem; font-weight: bold; display: none; z-index: 100; animation: fadeOut 2s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="save-indicator">Sincronizado</div>

    <div class="max-w-7xl mx-auto pb-24">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="editAppTitle()">
                <h1 id="app-display-title" class="text-2xl md:text-3xl font-extrabold text-white uppercase tracking-tighter">Finanças Pro</h1>
                <i data-lucide="pencil" class="w-4 h-4 text-blue-400"></i>
            </div>
            <div class="flex flex-wrap justify-center items-center gap-2">
                <button onclick="openModal('global-tool-modal')" class="btn btn-warning shadow-lg shadow-yellow-500/20">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Recorrentes
                </button>
                <button onclick="advanceTimeline()" class="btn btn-primary shadow-lg shadow-blue-500/20">
                    <i data-lucide="fast-forward" class="w-4 h-4"></i> Encerrar Mês
                </button>
                <button onclick="openModal('backup-modal-overlay')" class="btn btn-secondary">
                    <i data-lucide="database" class="w-4 h-4"></i> Backup
                </button>
            </div>
        </header>

        <!-- Navegação de Meses -->
        <div class="flex items-center border-b border-slate-700 mb-8 overflow-hidden bg-slate-900/30 rounded-t-lg">
            <div class="flex overflow-x-auto no-scrollbar flex-grow" id="month-tabs-container"></div>
            <div onclick="addNewMonthManual()" class="px-4 text-slate-400 hover:text-blue-500 cursor-pointer border-l border-slate-700" title="Novo Mês">
                <i data-lucide="plus-circle" class="w-6 h-6"></i>
            </div>
        </div>

        <div id="planilhas-container"></div>

        <footer class="mt-12 border-t border-slate-700 pt-8 text-center">
            <button onclick="exportCurrentMonthCSV()" class="btn btn-success">
                <i data-lucide="file-spreadsheet"></i> Exportar Dados (CSV)
            </button>
        </footer>
    </div>

    <!-- Botão de Gráfico Flutuante -->
    <div class="fab" onclick="openChartModal()">
        <i data-lucide="bar-chart-3"></i>
    </div>

    <!-- MODAL GESTÃO GLOBAL (FIXADO) -->
    <div id="global-tool-modal" class="modal-overlay">
        <div class="card w-full max-w-lg">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2 text-yellow-400"><i data-lucide="zap"></i> Gestão Recorrente</h2>
                <button onclick="closeModal('global-tool-modal')" class="p-2 hover:bg-slate-700 rounded-full"><i data-lucide="x"></i></button>
            </div>
            
            <div class="space-y-6">
                <!-- Adicionar em Massa -->
                <div class="p-4 bg-slate-900/50 rounded-xl border border-slate-700">
                    <h3 class="text-xs font-bold mb-4 text-slate-400 uppercase tracking-widest">Adicionar item em todos os meses</h3>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <input type="text" id="global-name" placeholder="Ex: Spotify" class="input-field">
                        <input type="number" id="global-value" placeholder="Valor" class="input-field">
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <select id="global-type" class="input-field">
                            <option value="fixed">Dívida Fixa</option>
                            <option value="variable">Dívida Variável</option>
                            <option value="income">Entrada</option>
                        </select>
                        <input type="date" id="global-date" class="input-field">
                    </div>
                    <button id="btn-apply-global" onclick="applyGlobalItem()" class="btn btn-primary w-full py-3 font-bold uppercase transition-all active:scale-95">Aplicar em Tudo</button>
                    <p id="global-status-msg" class="text-[10px] text-blue-400 mt-2 text-center hidden font-bold">Processado com sucesso!</p>
                </div>

                <!-- Remover em Massa -->
                <div class="p-4 bg-red-500/5 rounded-xl border border-red-500/20">
                    <h3 class="text-xs font-bold mb-4 text-red-400 uppercase tracking-widest">Remover de todos os meses</h3>
                    <div class="flex gap-2">
                        <input type="text" id="global-remove-name" placeholder="Nome exato do item" class="input-field">
                        <button onclick="removeGlobalItem()" class="btn bg-red-600 hover:bg-red-700 text-white"><i data-lucide="trash-2"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modais Auxiliares -->
    <div id="chart-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-4xl"><div class="flex justify-between items-center mb-6"><h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="line-chart"></i> Evolução Financeira</h2><button onclick="closeModal('chart-modal-overlay')"><i data-lucide="x"></i></button></div><div class="h-[50vh]"><canvas id="globalChart"></canvas></div></div>
    </div>
    <div id="cashflow-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden"><div class="flex justify-between items-center mb-6"><h2 class="text-xl font-bold" id="cashflow-title">Fluxo Cronológico</h2><button onclick="closeModal('cashflow-modal-overlay')"><i data-lucide="x"></i></button></div><div class="overflow-y-auto pr-2 no-scrollbar" id="cashflow-content"></div></div>
    </div>
    <div id="backup-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-md text-center"><div class="flex justify-between items-center mb-6"><h2 class="text-xl font-bold"><i data-lucide="settings"></i> Dados</h2><button onclick="closeModal('backup-modal-overlay')"><i data-lucide="x"></i></button></div><div class="space-y-4"><p class="text-xs text-slate-400">Os dados são locais. Use o backup para mover entre aparelhos.</p><button onclick="downloadBackup()" class="btn btn-primary w-full">Salvar Backup</button><input type="file" id="importFile" class="hidden" accept=".json" onchange="handleImport(this)"><button onclick="document.getElementById('importFile').click()" class="btn btn-secondary w-full">Carregar Backup</button></div></div>
    </div>
    <div id="confirm-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-sm text-center"><h3 class="text-xl font-bold mb-4" id="confirm-title">Atenção</h3><p class="text-slate-400 mb-6" id="confirm-body"></p><div class="flex justify-center gap-4"><button id="confirm-btn-yes" class="btn btn-primary px-8">Sim</button><button onclick="closeModal('confirm-modal-overlay')" class="btn btn-secondary px-8">Não</button></div></div>
    </div>

    <script>
        const STORAGE_KEY = 'financialData_Final_Production_v31_stable';
        const TITLE_KEY = 'financialApp_Title_Production_v31';
        const HORA_EXTRA_RATE = 21;
        const MONTH_NAMES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        
        let timeline = [];
        let activeIndex = 0;
        let globalChart = null;

        function initApp() {
            const savedTitle = localStorage.getItem(TITLE_KEY);
            if (savedTitle) { document.getElementById('app-display-title').innerText = savedTitle; }
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                timeline = JSON.parse(saved);
            } else {
                createInitialTimeline();
            }
            renderAll();
            selecionarMes(0);
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(timeline));
            const indicator = document.getElementById('save-indicator');
            indicator.style.display = 'block';
            setTimeout(() => { indicator.style.display = 'none'; }, 2000);
        }

        function refreshUI() {
            timeline.forEach((_, idx) => {
                renderMonthLists(idx);
                updateStats(idx);
            });
            renderTabs();
        }

        function createInitialTimeline() {
            let now = new Date();
            let startMonth = now.getMonth();
            let startYear = now.getFullYear();
            timeline = [];
            for (let i = 0; i < 6; i++) {
                let mIdx = (startMonth + i) % 12;
                let yOff = Math.floor((startMonth + i) / 12);
                timeline.push({ label: MONTH_NAMES[mIdx], year: startYear + yOff, data: createEmptyMonthData(mIdx, startYear + yOff) });
            }
            saveData();
        }

        function createEmptyMonthData(mIdx, year) {
            const firstDay = new Date(year, mIdx, 1).toISOString().slice(0, 10);
            return {
                incomeEntries: [{ id: 'saldo-sys', name: 'Saldo Anterior', value: 0, isSystem: true, date: firstDay }],
                fixedExpenses: [],
                variableExpenses: []
            };
        }

        function renderAll() { 
            renderTabs(); 
            renderMonths(); 
            lucide.createIcons(); 
        }

        function renderTabs() {
            const container = document.getElementById('month-tabs-container');
            if (!container) return;
            container.innerHTML = timeline.map((m, i) => {
                const unpaid = [...m.data.fixedExpenses, ...m.data.variableExpenses].filter(e => !e.isPaid).length;
                const activeClass = i === activeIndex ? 'active-month-tab' : '';
                return `<button onclick="selecionarMes(${i})" id="tab-${i}" class="month-tab ${activeClass}">${m.label} ${unpaid > 0 ? `<span class="ml-1 bg-red-500 text-[10px] text-white px-1.5 py-0.5 rounded-full font-black">${unpaid}</span>` : ''}</button>`
            }).join('');
        }

        function renderMonths() {
            const container = document.getElementById('planilhas-container');
            container.innerHTML = '';
            
            timeline.forEach((m, i) => {
                const div = document.createElement('div');
                div.id = `container-${i}`;
                div.className = `planilha-mes-container space-y-6 ${i === activeIndex ? 'active-month-container' : ''}`;
                div.innerHTML = `
                    <div class="card bg-slate-800/40 border-blue-500/20">
                        <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                            <div class="flex-grow w-full text-left">
                                <h4 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3"> Resumo: ${m.label} ${m.year}</h4>
                                <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                    <div id="prog-paid-${i}" class="bg-green-500 h-full transition-all duration-700" style="width: 0%"></div>
                                </div>
                                <div class="flex justify-between items-center mt-2">
                                    <span class="text-xs text-slate-500 font-bold" id="txt-prog-${i}">0% concluído</span>
                                    <button onclick="showCashFlow(${i})" class="text-xs text-blue-400 hover:text-white flex items-center gap-1 transition-colors"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> Analisar Fluxo</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4 w-full md:w-auto">
                                <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700 text-center min-w-[130px]"><p class="text-[10px] text-slate-500 uppercase font-bold">Entradas</p><p class="text-lg font-black text-green-400" id="stat-inc-${i}">R$ 0</p></div>
                                <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700 text-center min-w-[130px]"><p class="text-[10px] text-slate-500 uppercase font-bold">Saldo restante</p><p class="text-lg font-black text-blue-400" id="stat-bal-${i}">R$ 0</p></div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6 pt-6 border-t border-slate-700/30 text-center">
                            <div><p class="text-[10px] text-slate-500 uppercase font-bold">Fixas</p><p class="text-sm font-bold text-blue-300" id="det-fix-${i}">R$ 0</p></div>
                            <div><p class="text-[10px] text-slate-500 uppercase font-bold">Variáveis</p><p class="text-sm font-bold text-orange-300" id="det-var-${i}">R$ 0</p></div>
                            <div><p class="text-[10px] text-slate-500 uppercase font-bold text-red-400">Pendente</p><p class="text-sm font-bold text-red-500" id="det-pend-${i}">R$ 0</p></div>
                            <div><p class="text-[10px] text-slate-500 uppercase font-bold">Total Mês</p><p class="text-sm font-bold text-white" id="det-tot-${i}">R$ 0</p></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="card border-l-4 border-green-500 h-fit"><div class="flex justify-between items-center mb-6"><h3 class="text-lg font-bold text-green-400 flex items-center gap-2"><i data-lucide="wallet"></i> Entradas</h3><i data-lucide="copy" class="w-4 h-4 text-slate-500 cursor-pointer" onclick="copyPrev(${i},'income')"></i></div><div id="list-income-${i}" class="space-y-3"></div><button onclick="addItem(${i}, 'income')" class="btn btn-secondary btn-sm w-full mt-6">+ Nova Entrada</button></div>
                        <div class="card border-l-4 border-blue-500 h-fit"><div class="flex justify-between items-center mb-6"><h4 class="text-lg font-bold text-blue-400 flex items-center gap-2"><i data-lucide="lock"></i> Fixas</h4><i data-lucide="copy" class="w-4 h-4 text-slate-500 cursor-pointer" onclick="copyPrev(${i},'fixed')"></i></div><div id="list-fixed-${i}" class="space-y-3"></div><button onclick="addItem(${i}, 'fixed')" class="btn btn-secondary btn-sm w-full mt-6">+ Nova Fixa</button></div>
                        <div class="card border-l-4 border-orange-500 h-fit"><div class="flex justify-between items-center mb-6"><h4 class="text-lg font-bold text-orange-400 flex items-center gap-2"><i data-lucide="shopping-bag"></i> Variáveis</h4><i data-lucide="copy" class="w-4 h-4 text-slate-500 cursor-pointer" onclick="copyPrev(${i},'variable')"></i></div><div id="list-variable-${i}" class="space-y-3"></div><button onclick="addItem(${i}, 'variable')" class="btn btn-secondary btn-sm w-full mt-6">+ Nova Variável</button></div>
                    </div>
                `;
                container.appendChild(div);
            });
            timeline.forEach((_, idx) => renderMonthLists(idx));
        }

        function renderMonthLists(mIdx) {
            renderItemList(mIdx, 'income', timeline[mIdx].data.incomeEntries);
            renderItemList(mIdx, 'fixed', timeline[mIdx].data.fixedExpenses);
            renderItemList(mIdx, 'variable', timeline[mIdx].data.variableExpenses);
        }

        function renderItemList(mIdx, type, items) {
            const container = document.getElementById(`list-${type}-${mIdx}`);
            if (!container) return;
            container.innerHTML = items.map(item => {
                const isPaid = item.isPaid !== undefined ? item.isPaid : true;
                const statusClass = isPaid ? 'item-paid' : 'item-unpaid';
                let inputVal = `<input type="number" step="0.01" value="${item.value || 0}" class="input-field text-sm w-full" onchange="updateValue(${mIdx},'${type}','${item.id}',this.value)" ${item.isCalculated || item.isSystem ? 'readonly' : ''}>`;
                if (item.isCalculated) {
                    const tot = (item.hours||0)*(item.rate||0);
                    inputVal = `<div class="flex gap-1"><input type="number" value="${item.hours || 0}" class="input-field text-xs w-12" onchange="updateProp(${mIdx},'income','${item.id}','hours',this.value)"><div class="input-field text-xs bg-slate-800 flex items-center justify-center font-bold min-w-[75px]">R$ ${tot.toFixed(2)}</div></div>`;
                }
                const showSync = findOccurrences(item.name).length > 1 && !item.isSystem;
                return `<div class="p-3 rounded-lg item-row ${statusClass}">${!item.isSystem ? `<div onclick="removeItem(${mIdx},'${type}','${item.id}')" class="btn-remove"><i data-lucide="x" class="w-4 h-4"></i></div>` : ''}${showSync ? `<div onclick="syncItemValue('${item.name}', ${item.value}, '${type}')" class="btn-sync"><i data-lucide="refresh-cw" class="w-4 h-4"></i></div>` : ''}<input type="text" value="${item.name}" class="main-text bg-transparent border-none text-sm font-bold w-full focus:ring-0 mb-2 mt-1" onchange="updateProp(${mIdx},'${type}','${item.id}','name',this.value)" ${item.isSystem?'readonly':''}><div class="flex items-center gap-2"><input type="date" value="${item.date||''}" class="input-field text-[10px] p-1 h-9 w-28" onchange="updateProp(${mIdx},'${type}','${item.id}','date',this.value)"><div class="flex-grow">${inputVal}</div>${item.isPaid!==undefined && !item.isSystem ? `<label class="toggle-switch"><input type="checkbox" ${isPaid?'checked':''} onchange="togglePaid(${mIdx},'${type}','${item.id}')"><span class="slider"></span></label>`: (item.isSystem ? '<div class="w-[42px]"></div>' : '')}</div></div>`}).join('');
            lucide.createIcons();
        }

        // --- CORE ---
        function updateProp(mIdx,type,id,p,v) { const i = getL(mIdx,type).find(x=>x.id==id); if(i){ i[p]=(p==='hours'?parseFloat(v):v); saveData(); propagateBalances(); refreshUI(); } }
        function updateValue(mIdx,type,id,v) { const i = getL(mIdx,type).find(x=>x.id==id); if(i){ i.value=parseFloat(v)||0; saveData(); propagateBalances(); refreshUI(); } }
        function togglePaid(mIdx,type,id) { const i = getL(mIdx,type).find(x=>x.id==id); if(i){ i.isPaid=!i.isPaid; saveData(); refreshUI(); } }
        function addItem(mIdx,type) { getL(mIdx,type).push({ id: Math.random(), name: 'Novo Item', value: 0, date: new Date().toISOString().slice(0,10), isPaid: false }); saveData(); propagateBalances(); refreshUI(); }
        function removeItem(mIdx,type,id) { customConfirm("Remover?", "Apagar este item?", () => { const key = type==='income'?'incomeEntries':(type==='fixed'?'fixedExpenses':'variableExpenses'); timeline[mIdx].data[key] = getL(mIdx,type).filter(x=>x.id!=id); saveData(); propagateBalances(); refreshUI(); }); }
        function getL(mIdx,type) { const d = timeline[mIdx].data; return type==='income'?d.incomeEntries:(type==='fixed'?d.fixedExpenses:d.variableExpenses); }

        function copyPrev(mIdx, type) {
            if (mIdx === 0) return;
            const key = type==='income'?'incomeEntries':(type==='fixed'?'fixedExpenses':'variableExpenses');
            const clean = JSON.parse(JSON.stringify(timeline[mIdx-1].data[key])).filter(x=>!x.isSystem).map(x=>({...x, id:Math.random(), isPaid:false}));
            if(type==='income'){ const sys = timeline[mIdx].data.incomeEntries.find(x=>x.isSystem); timeline[mIdx].data.incomeEntries = [sys, ...clean]; } else { timeline[mIdx].data[key] = clean; }
            saveData(); propagateBalances(); refreshUI();
        }

        function propagateBalances() {
            for (let i = 0; i < timeline.length - 1; i++) {
                const d = timeline[i].data;
                const inc = d.incomeEntries.reduce((s, x) => s + (x.isCalculated ? (x.hours * x.rate) : (x.value || 0)), 0);
                const fixT = d.fixedExpenses.reduce((s, x) => s + (x.value || 0), 0);
                const varT = d.variableExpenses.reduce((s, x) => s + (x.value || 0), 0);
                let nextSys = timeline[i+1].data.incomeEntries.find(x => x.isSystem);
                if(nextSys) nextSys.value = inc - (fixT + varT);
            }
        }

        function updateStats(mIdx) {
            const d = timeline[mIdx].data;
            const inc = d.incomeEntries.reduce((s, x) => s + (x.isCalculated ? (x.hours * x.rate) : (x.value || 0)), 0);
            const fixP = d.fixedExpenses.reduce((s, x) => s + (x.isPaid ? x.value : 0), 0);
            const fixT = d.fixedExpenses.reduce((s, x) => s + (x.value || 0), 0);
            const varP = d.variableExpenses.reduce((s, x) => s + (x.isPaid ? x.value : 0), 0);
            const varT = d.variableExpenses.reduce((s, x) => s + (x.value || 0), 0);
            const tT = fixT + varT; const tP = fixP + varP;
            const elInc = document.getElementById(`stat-inc-${mIdx}`); if(elInc) elInc.textContent = formatBRL(inc);
            const elBal = document.getElementById(`stat-bal-${mIdx}`);
            if(elBal) { const bal = inc - tT; elBal.textContent = formatBRL(bal); elBal.className = `text-lg font-black ${bal>=0?'text-blue-400':'text-red-400'}`; }
            const dfix = document.getElementById(`det-fix-${mIdx}`); if(dfix) dfix.textContent = formatBRL(fixT);
            const dvar = document.getElementById(`det-var-${mIdx}`); if(dvar) dvar.textContent = formatBRL(varT);
            const dpen = document.getElementById(`det-pend-${mIdx}`); if(dpen) dpen.textContent = formatBRL(tT - tP);
            const dtot = document.getElementById(`det-tot-${mIdx}`); if(dtot) dtot.textContent = formatBRL(tT);
            const prog = tT > 0 ? (tP / tT * 100).toFixed(0) : 0;
            const elBar = document.getElementById(`prog-paid-${mIdx}`); if(elBar) elBar.style.width = prog + '%';
            const elTxt = document.getElementById(`txt-prog-${mIdx}`); if(elTxt) elTxt.textContent = prog + '% concluído';
        }

        // --- GESTÃO GLOBAL (FIXADA) ---
        function applyGlobalItem() {
            const nameEl = document.getElementById('global-name');
            const valEl = document.getElementById('global-value');
            const typeEl = document.getElementById('global-type');
            const dateEl = document.getElementById('global-date');
            
            if(!nameEl.value || !dateEl.value) {
                alert("Preencha o Nome e a Data para continuar.");
                return;
            }

            const name = nameEl.value;
            const value = parseFloat(valEl.value) || 0;
            const type = typeEl.value;
            const targetDay = new Date(dateEl.value + 'T00:00:00').getDate();

            timeline.forEach(m => {
                const list = type==='income'?m.data.incomeEntries:(type==='fixed'?m.data.fixedExpenses:m.data.variableExpenses);
                const mIdx = MONTH_NAMES.indexOf(m.label);
                let targetDate = new Date(m.year, mIdx, targetDay);
                if (targetDate.getMonth() !== mIdx) targetDate.setDate(0); 
                const dateStr = targetDate.toISOString().slice(0, 10);
                list.push({ id: Math.random(), name, value, date: dateStr, isPaid: false });
            });

            saveData(); propagateBalances(); refreshUI();
            
            // Feedback Visual
            const msg = document.getElementById('global-status-msg');
            msg.classList.remove('hidden');
            setTimeout(() => { 
                msg.classList.add('hidden');
                closeModal('global-tool-modal'); 
                nameEl.value = ''; valEl.value = '';
            }, 1000);
        }

        function removeGlobalItem() {
            const name = document.getElementById('global-remove-name').value;
            if(!name) return;
            customConfirm("Apagar?", `Remover "${name}" de todos os meses?`, () => {
                timeline.forEach(m => {
                    m.data.incomeEntries = m.data.incomeEntries.filter(x => x.name !== name);
                    m.data.fixedExpenses = m.data.fixedExpenses.filter(x => x.name !== name);
                    m.data.variableExpenses = m.data.variableExpenses.filter(x => x.name !== name);
                });
                saveData(); propagateBalances(); refreshUI(); closeModal('global-tool-modal');
            });
        }

        function syncItemValue(name, newValue, type) {
            customConfirm("Sincronizar?", `Aplicar ${formatBRL(newValue)} para "${name}" em todos os meses?`, () => {
                timeline.forEach(m => {
                    const list = type==='income'?m.data.incomeEntries:(type==='fixed'?m.data.fixedExpenses:m.data.variableExpenses);
                    list.forEach(i => { if(i.name === name) i.value = newValue; });
                });
                saveData(); propagateBalances(); refreshUI();
            });
        }

        function findOccurrences(name) {
            let res = []; timeline.forEach((m, idx) => { if([...m.data.incomeEntries, ...m.data.fixedExpenses, ...m.data.variableExpenses].find(x => x.name === name)) res.push(idx); });
            return res;
        }

        // --- UI AUX ---
        function selecionarMes(idx) {
            activeIndex = idx;
            document.querySelectorAll('.planilha-mes-container').forEach(c => c.classList.remove('active-month-container'));
            const c = document.getElementById(`container-${idx}`); if(c) c.classList.add('active-month-container');
            document.querySelectorAll('.month-tab').forEach(t => t.classList.remove('active-month-tab'));
            const t = document.getElementById(`tab-${idx}`); if(t) t.classList.add('active-month-tab');
            refreshUI();
        }
        function addNewMonthManual() { const last = timeline[timeline.length - 1]; let nextMIdx = (MONTH_NAMES.indexOf(last.label) + 1) % 12; let nextYear = nextMIdx === 0 ? last.year + 1 : last.year; timeline.push({ label: MONTH_NAMES[nextMIdx], year: nextYear, data: createEmptyMonthData(nextMIdx, nextYear) }); propagateBalances(); saveData(); renderMonths(); selecionarMes(timeline.length - 1); }
        function advanceTimeline() { customConfirm("Encerrar?", "Remover primeiro mês da lista?", () => { timeline.shift(); if(timeline.length < 1) createInitialTimeline(); else { const last = timeline[timeline.length - 1]; let nextMIdx = (MONTH_NAMES.indexOf(last.label) + 1) % 12; let nextYear = nextMIdx === 0 ? last.year + 1 : last.year; timeline.push({ label: MONTH_NAMES[nextMIdx], year: nextYear, data: createEmptyMonthData(nextMIdx, nextYear) }); } saveData(); propagateBalances(); location.reload(); }); }
        function editAppTitle() { const n = prompt("Nome da folha:", "Finanças Pro"); if(n){ document.getElementById('app-display-title').innerText = n; localStorage.setItem(TITLE_KEY, n); } }
        function openModal(id) { document.getElementById(id).style.display='flex'; lucide.createIcons(); }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        function openChartModal() { openModal('chart-modal-overlay'); setTimeout(updateChart, 100); }
        function customConfirm(t, b, cb) { document.getElementById('confirm-title').innerText = t; document.getElementById('confirm-body').innerText = b; const btn = document.getElementById('confirm-btn-yes'); btn.onclick = () => { closeModal('confirm-modal-overlay'); cb(); }; openModal('confirm-modal-overlay'); }
        function formatBRL(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function downloadBackup() { const b = new Blob([JSON.stringify(timeline)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `backup_financas.json`; a.click(); }
        function handleImport(input) { const r = new FileReader(); r.onload = e => { timeline = JSON.parse(e.target.result); saveData(); location.reload(); }; r.readAsText(input.files[0]); }
        function showCashFlow(idx) {
            const m = timeline[idx];
            const entries = [...m.data.incomeEntries.map(i => ({ ...i, val: i.isCalculated?i.hours*i.rate:i.value, type:'IN' })), ...m.data.fixedExpenses.map(i => ({ ...i, val: -i.value, type:'OUT' })), ...m.data.variableExpenses.map(i => ({ ...i, val: -i.value, type:'OUT' }))].sort((a,b) => { const dA = new Date(a.date || '9999-12-31'); const dB = new Date(b.date || '9999-12-31'); if (dA - dB !== 0) return dA - dB; return a.type === 'IN' ? -1 : 1; });
            let run = 0;
            document.getElementById('cashflow-content').innerHTML = `<table class="w-full text-left"><thead class="sticky top-0 bg-slate-800 text-[10px] uppercase text-slate-500"><tr><th class="p-3">Data</th><th>Descrição</th><th class="text-right">Valor</th><th class="text-right p-3">Saldo</th></tr></thead><tbody>${entries.map(e=>{ run+=e.val; return `<tr class="border-b border-slate-700/50 text-xs hover:bg-slate-700/20 transition-colors"><td class="p-3 text-slate-500 font-mono">${e.date?new Date(e.date+'T00:00:00').toLocaleDateString('pt-BR'):'-'}</td><td class="font-bold text-slate-300">${e.name}</td><td class="text-right font-bold ${e.type==='IN'?'text-green-400':'text-red-400'}">${formatBRL(e.val)}</td><td class="text-right font-black p-3 ${run<0?'text-red-500':'text-blue-400'}">${formatBRL(run)}</td></tr>`}).join('')}</tbody></table>`;
            document.getElementById('cashflow-title').innerText = `Fluxo: ${m.label} ${m.year}`; openModal('cashflow-modal-overlay');
        }
        function updateChart() {
            const ctx = document.getElementById('globalChart').getContext('2d');
            const labels = timeline.map(m=>m.label);
            const incs = timeline.map(m=>m.data.incomeEntries.reduce((s, x) => s + (x.isCalculated ? (x.hours * x.rate) : (x.value || 0)), 0));
            const exps = timeline.map(m=>m.data.fixedExpenses.reduce((s, x) => s + (x.value || 0), 0) + m.data.variableExpenses.reduce((s, x) => s + (x.value || 0), 0));
            if(globalChart) globalChart.destroy();
            globalChart = new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ label: 'Renda', data: incs, backgroundColor: '#3b82f6', borderRadius: 4 }, { label: 'Saídas', data: exps, backgroundColor: '#ef4444', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }, x: { grid: { display: false }, ticks: { color: '#94a3b8' } } }, plugins: { legend: { labels: { color: '#f1f5f9' } } } } });
        }
        function exportCurrentMonthCSV() { const m = timeline[activeIndex]; let csv = "Tipo;Data;Descricao;Valor;Status\n"; const add = (t, l) => l.forEach(i => csv += `${t};${i.date || ''};${i.name};${i.isCalculated ? i.hours*i.rate : i.value};${i.isPaid === false ? 'Pendente' : 'Pago'}\n`); add('Entrada', m.data.incomeEntries); add('Fixa', m.data.fixedExpenses); add('Variavel', m.data.variableExpenses); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); a.download = `planilha_${m.label.toLowerCase()}.csv`; a.click(); }
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>

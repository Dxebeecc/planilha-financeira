<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617"/>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title id="page-title">Finanças Pro v41</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        
        .card { background-color: #1e293b; border-radius: 1.25rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2); padding: 1.25rem; border: 1px solid #334155; }
        
        /* Itens de lista */
        .item-row { transition: all 0.2s ease; border-width: 2px; border-style: solid; border-radius: 1.25rem; position: relative; background-color: #1e293b; }
        .item-paid { background-color: rgba(16, 185, 129, 0.06); border-color: rgba(16, 185, 129, 0.3) !important; }
        .item-paid .main-text, .item-paid input { color: #10b981 !important; }
        .item-unpaid { background-color: rgba(239, 68, 68, 0.06); border-color: rgba(239, 68, 68, 0.3) !important; }
        .item-unpaid .main-text, .item-unpaid input { color: #ef4444 !important; }

        .input-field { background-color: #0f172a; color: #f1f5f9; border: 1px solid #334155; border-radius: 0.75rem; padding: 0.5rem 0.75rem; width: 100%; transition: all 0.2s; font-size: 0.85rem; }
        .input-field:focus { border-color: #3b82f6; outline: none; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.6rem 1rem; border-radius: 0.8rem; font-weight: 700; cursor: pointer; border: none; font-size: 0.8rem; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-secondary { background-color: #334155; color: #f1f5f9; }
        .btn-warning { background-color: #f59e0b; color: white; }

        .fab { position: fixed; bottom: 1.5rem; right: 1.5rem; width: 3.5rem; height: 3.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: #3b82f6; color: white; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5); cursor: pointer; z-index: 40; }

        .month-tab { position: relative; padding: 0.8rem 1.2rem; border-bottom: 3px solid transparent; transition: all 0.3s; opacity: 0.5; cursor: pointer; background: transparent; color: inherit; font-weight: 800; white-space: nowrap; font-size: 0.85rem; }
        .active-month-tab { opacity: 1 !important; border-bottom-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.1); }
        
        .toggle-switch { position: relative; display: inline-flex; width: 42px; height: 20px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(20px); }

        .planilha-mes-container { display: none; }
        .active-month-container { display: block !important; }

        /* Bancos Customizáveis */
        .bank-input-live { background: transparent; border: none; font-size: 1.3rem; font-weight: 900; color: #10b981; text-align: center; width: 100%; outline: none; padding: 0; }
        .bank-name-input { background: transparent; border: none; font-size: 0.7rem; font-weight: 900; color: #94a3b8; text-align: center; width: 100%; outline: none; text-transform: uppercase; margin-bottom: 4px; }
        .bank-tag { font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; font-weight: 900; background: #0f172a; border: 1px solid #334155; cursor: pointer; min-width: 40px; text-align: center; }

        .modal-overlay { position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.85); z-index: 100; display: none; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        #save-indicator { position: fixed; top: 1rem; right: 1rem; padding: 0.4rem 0.8rem; border-radius: 2rem; background: #10b981; color: white; font-size: 0.7rem; font-weight: bold; display: none; z-index: 200; animation: fadeOut 2s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body class="p-4 md:p-8 pb-24">

    <div id="save-indicator">Sincronizado</div>

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="editAppTitle()">
                <h1 id="app-display-title" class="text-2xl md:text-3xl font-black text-white tracking-tighter uppercase">Finanças Pro</h1>
                <i data-lucide="pencil" class="w-4 h-4 text-blue-400"></i>
            </div>
            <div class="flex flex-wrap justify-center items-center gap-2">
                <button onclick="openModal('global-tool-modal')" class="btn btn-warning shadow-lg shadow-yellow-500/20"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Recorrentes</button>
                <button onclick="advanceTimeline()" class="btn btn-primary"><i data-lucide="fast-forward" class="w-4 h-4"></i> Encerrar Mês</button>
                <button onclick="openModal('backup-modal-overlay')" class="btn btn-secondary"><i data-lucide="database" class="w-4 h-4"></i> Backup</button>
            </div>
        </header>

        <!-- Navegação de Meses -->
        <div class="flex items-center border-b border-slate-700 mb-8 overflow-hidden bg-slate-900/30 rounded-t-2xl">
            <div class="flex overflow-x-auto no-scrollbar flex-grow" id="month-tabs-container"></div>
            <div onclick="addNewMonthManual()" class="px-4 text-slate-400 hover:text-blue-500 cursor-pointer border-l border-slate-700">
                <i data-lucide="plus-circle" class="w-6 h-6"></i>
            </div>
        </div>

        <!-- Renderizador -->
        <div id="planilhas-container"></div>

        <footer class="mt-12 border-t border-slate-700 pt-8 text-center opacity-30">
            <button onclick="exportCurrentMonthCSV()" class="btn btn-success text-xs"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Exportar Dados</button>
        </footer>
    </div>

    <!-- Gráfico FAB -->
    <div class="fab shadow-2xl" onclick="openChartModal()"><i data-lucide="bar-chart-3"></i></div>

    <!-- Modais -->
    <div id="global-tool-modal" class="modal-overlay">
        <div class="card w-full max-w-lg">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-yellow-400">Item em Massa</h2>
                <button onclick="closeModal('global-tool-modal')" class="p-2 hover:bg-slate-700 rounded-full"><i data-lucide="x"></i></button>
            </div>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="global-name" placeholder="Ex: Spotify" class="input-field">
                    <input type="number" id="global-value" placeholder="Valor" class="input-field">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <select id="global-type" class="input-field">
                        <option value="fixed">Dívida Fixa</option>
                        <option value="variable">Dívida Variável</option>
                        <option value="income">Entrada</option>
                    </select>
                    <input type="date" id="global-date" class="input-field">
                </div>
                <button onclick="applyGlobalItem()" class="btn btn-primary w-full py-3 font-black uppercase">Lançar em Todos os Meses</button>
            </div>
        </div>
    </div>

    <div id="chart-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-4xl"><div class="flex justify-between items-center mb-4"><h2>Evolução</h2><button onclick="closeModal('chart-modal-overlay')"><i data-lucide="x"></i></button></div><div class="h-[45vh]"><canvas id="globalChart"></canvas></div></div>
    </div>
    <div id="cashflow-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden"><div class="flex justify-between items-center mb-4"><h2 id="cashflow-title">Fluxo</h2><button onclick="closeModal('cashflow-modal-overlay')"><i data-lucide="x"></i></button></div><div class="overflow-y-auto no-scrollbar" id="cashflow-content"></div></div>
    </div>
    <div id="backup-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-sm text-center"><div class="flex justify-between items-center mb-6"><h2>Configurações</h2><button onclick="closeModal('backup-modal-overlay')"><i data-lucide="x"></i></button></div><div class="space-y-3"><button onclick="downloadBackup()" class="btn btn-primary w-full py-3">Exportar Backup</button><input type="file" id="importFile" class="hidden" accept=".json" onchange="handleImport(this)"><button onclick="document.getElementById('importFile').click()" class="btn btn-secondary w-full py-3">Importar Backup</button></div></div>
    </div>
    <div id="confirm-modal-overlay" class="modal-overlay">
        <div class="card w-full max-w-xs text-center"><h3 class="mb-4">Deseja prosseguir?</h3><p id="confirm-body" class="text-sm text-slate-400 mb-6"></p><div class="flex justify-center gap-4"><button id="confirm-btn-yes" class="btn btn-primary px-8">Sim</button><button onclick="closeModal('confirm-modal-overlay')" class="btn btn-secondary">Não</button></div></div>
    </div>

    <script>
        const STORAGE_KEY = 'financialData_App_v41_final';
        const TITLE_KEY = 'financialApp_Title_v35';
        const MONTH_NAMES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        
        let timeline = [];
        let activeIndex = 0;
        let globalChart = null;

        function initApp() {
            const savedTitle = localStorage.getItem(TITLE_KEY);
            if (savedTitle) { document.getElementById('app-display-title').innerText = savedTitle; }
            
            let saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) saved = localStorage.getItem('financialData_Classic_v40_wallet');
            if (!saved) saved = localStorage.getItem('financialData_App_v38_stable');
            
            if (saved) {
                timeline = JSON.parse(saved);
                migrateToV41();
            } else {
                createInitialTimeline();
            }
            renderAll();
            selecionarMes(0);
        }

        function createInitialTimeline() {
            let now = new Date();
            let startMonth = now.getMonth();
            let startYear = now.getFullYear();
            timeline = [];
            for (let i = 0; i < 6; i++) {
                let mIdx = (startMonth + i) % 12;
                let yOff = Math.floor((startMonth + i) / 12);
                timeline.push({ 
                    label: MONTH_NAMES[mIdx], 
                    year: startYear + yOff, 
                    bank1Name: 'BANCO DO BRASIL',
                    bank2Name: 'MERCADO PAGO',
                    bank1Balance: 0, 
                    bank2Balance: 0,
                    data: createEmptyMonthData(mIdx, startYear + yOff) 
                });
            }
            saveData();
        }

        function createEmptyMonthData(mIdx, year) {
            const firstDay = new Date(year, mIdx, 1).toISOString().slice(0, 10);
            return {
                incomeEntries: [{ id: 'saldo-sys', name: 'Saldo Anterior', value: 0, isSystem: true, date: firstDay }],
                fixedExpensesEntries: [],
                variableExpensesEntries: []
            };
        }

        function migrateToV41() {
            timeline.forEach(m => {
                if (!m.bank1Name) m.bank1Name = 'BANCO DO BRASIL';
                if (!m.bank2Name) m.bank2Name = 'MERCADO PAGO';
                if (m.bank1Balance === undefined) m.bank1Balance = m.bankBB || 0;
                if (m.bank2Balance === undefined) m.bank2Balance = m.bankMP || 0;
                
                if (m.data) {
                    // Garante nomes consistentes das listas
                    if (m.data.fixedExpenses && !m.data.fixedExpensesEntries) m.data.fixedExpensesEntries = m.data.fixedExpenses;
                    if (m.data.variableExpenses && !m.data.variableExpensesEntries) m.data.variableExpensesEntries = m.data.variableExpenses;
                    
                    // Garante que as chaves de entrada existam como arrays
                    if (!m.data.incomeEntries) m.data.incomeEntries = [];
                    if (!m.data.fixedExpensesEntries) m.data.fixedExpensesEntries = [];
                    if (!m.data.variableExpensesEntries) m.data.variableExpensesEntries = [];

                    const all = [...m.data.fixedExpensesEntries, ...m.data.variableExpensesEntries];
                    all.forEach(item => { 
                        if (item.source === undefined || item.source === 'BB') item.source = 'B1';
                        if (item.source === 'MP') item.source = 'B2';
                    });
                }
            });
            saveData();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(timeline));
            const indicator = document.getElementById('save-indicator');
            if (indicator) { indicator.style.display = 'block'; setTimeout(() => { indicator.style.display = 'none'; }, 2000); }
        }

        function renderAll() {
            renderTabs();
            renderMonths();
            lucide.createIcons();
        }

        function renderTabs() {
            const container = document.getElementById('month-tabs-container');
            if (!container) return;
            container.innerHTML = timeline.map((m, i) => {
                const unpaid = [...(m.data.fixedExpensesEntries||[]), ...(m.data.variableExpensesEntries||[])].filter(e => !e.isPaid).length;
                return `<button onclick="selecionarMes(${i})" id="tab-${i}" class="month-tab ${i === activeIndex ? 'active-month-tab' : ''}">${m.label} ${unpaid > 0 ? `<span class="ml-1 bg-red-500 text-[9px] text-white px-1.5 py-0.5 rounded-full font-black">${unpaid}</span>` : ''}</button>`
            }).join('');
        }

        function renderMonths() {
            const container = document.getElementById('planilhas-container');
            if (!container) return; container.innerHTML = '';
            
            timeline.forEach((m, i) => {
                const div = document.createElement('div');
                div.id = `container-${i}`;
                div.className = `planilha-mes-container space-y-6 ${i === activeIndex ? 'active-month-container' : ''}`;
                div.innerHTML = `
                    <div class="card bg-slate-800/60 border-blue-500/20">
                        <div class="flex flex-col space-y-4">
                            <div class="flex justify-between items-center">
                                <h4 class="text-xs font-black text-slate-500 uppercase tracking-widest">${m.label} ${m.year}</h4>
                                <button onclick="showCashFlow(${i})" class="text-[10px] text-blue-400 font-bold"><i data-lucide="calendar" class="w-3 h-3 inline"></i> Analisar Fluxo</button>
                            </div>
                            <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                <div id="prog-paid-${i}" class="bg-green-500 h-full transition-all duration-700" style="width: 0%"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-slate-900/40 p-2 rounded-2xl border border-slate-700/50 text-center">
                                    <p class="text-[9px] text-slate-500 uppercase font-black mb-1">Renda Total</p>
                                    <p class="text-sm font-black text-green-400" id="stat-inc-${i}">R$ 0</p>
                                </div>
                                <div class="bg-slate-900/40 p-2 rounded-2xl border border-slate-700/50 text-center">
                                    <p class="text-[9px] text-slate-500 uppercase font-black mb-1">Saldo Restante</p>
                                    <p class="text-sm font-black text-blue-400" id="stat-bal-${i}">R$ 0</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-4 gap-2 pt-1 border-t border-slate-700/30 text-center">
                                <div><p class="text-[8px] text-slate-500 font-bold">FIXAS</p><p class="text-[10px] font-black text-blue-300" id="det-fix-${i}">R$ 0</p></div>
                                <div><p class="text-[8px] text-slate-500 font-bold">VARIAV.</p><p class="text-[10px] font-black text-orange-300" id="det-var-${i}">R$ 0</p></div>
                                <div><p class="text-[8px] text-red-500 font-black">PEND.</p><p class="text-[10px] font-black text-red-500" id="det-pend-${i}">R$ 0</p></div>
                                <div><p class="text-[8px] text-slate-500 font-bold">TOTAL</p><p class="text-[10px] font-black text-white" id="det-tot-${i}">R$ 0</p></div>
                            </div>
                            <div class="pt-4 border-t border-slate-700/30">
                                <h5 class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 text-center">Dinheiro em Conta (Real)</h5>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="bg-blue-900/10 p-3 rounded-2xl border border-blue-500/20 text-center">
                                        <input type="text" value="${m.bank1Name}" onchange="updateBankName(${i}, 'bank1Name', this.value)" class="bank-name-input">
                                        <div class="flex items-center justify-center font-black">
                                            <span class="text-xs text-green-500 mr-1">R$</span>
                                            <input type="number" step="0.01" value="0" id="live-b1-${i}" onchange="handleWalletEdit(${i}, 'bank1Balance', this.value)" class="bank-input-live">
                                        </div>
                                    </div>
                                    <div class="bg-green-900/10 p-3 rounded-2xl border border-green-500/20 text-center">
                                        <input type="text" value="${m.bank2Name}" onchange="updateBankName(${i}, 'bank2Name', this.value)" class="bank-name-input">
                                        <div class="flex items-center justify-center font-black">
                                            <span class="text-xs text-green-500 mr-1">R$</span>
                                            <input type="number" step="0.01" value="0" id="live-b2-${i}" onchange="handleWalletEdit(${i}, 'bank2Balance', this.value)" class="bank-input-live">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 pb-20">
                        <div class="card border-l-4 border-green-500 h-fit">
                            <div class="flex justify-between items-center mb-4"><h3 class="text-md font-black text-green-400 uppercase">Entradas</h3><i data-lucide="copy" class="w-4 h-4 text-slate-500 cursor-pointer" onclick="copyPrev(${i},'income')"></i></div>
                            <div id="list-income-${i}" class="space-y-3"></div>
                            <button onclick="addItem(${i}, 'income')" class="btn btn-secondary w-full mt-4">+ Nova Entrada</button>
                        </div>
                        <div class="card border-l-4 border-blue-500 h-fit">
                            <div class="flex justify-between items-center mb-4"><h4 class="text-md font-black text-blue-400 uppercase">Fixas</h4><i data-lucide="copy" class="w-4 h-4 text-slate-500 cursor-pointer" onclick="copyPrev(${i},'fixed')"></i></div>
                            <div id="list-fixed-${i}" class="space-y-3"></div>
                            <button onclick="addItem(${i}, 'fixed')" class="btn btn-secondary w-full mt-4">+ Nova Fixa</button>
                        </div>
                        <div class="card border-l-4 border-orange-500 h-fit">
                            <div class="flex justify-between items-center mb-4"><h4 class="text-md font-black text-orange-400 uppercase">Variáveis</h4><i data-lucide="copy" class="w-4 h-4 text-slate-500 cursor-pointer" onclick="copyPrev(${i},'variable')"></i></div>
                            <div id="list-variable-${i}" class="space-y-3"></div>
                            <button onclick="addItem(${i}, 'variable')" class="btn btn-secondary w-full mt-4">+ Nova Variável</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
            timeline.forEach((_, idx) => renderMonthLists(idx));
        }

        function renderMonthLists(mIdx) {
            renderItemList(mIdx, 'income', timeline[mIdx].data.incomeEntries);
            renderItemList(mIdx, 'fixed', timeline[mIdx].data.fixedExpensesEntries);
            renderItemList(mIdx, 'variable', timeline[mIdx].data.variableExpensesEntries);
        }

        function renderItemList(mIdx, type, items) {
            const container = document.getElementById(`list-${type}-${mIdx}`);
            if (!container) return;
            const b1S = timeline[mIdx].bank1Name.substring(0,3);
            const b2S = timeline[mIdx].bank2Name.substring(0,3);

            container.innerHTML = items.map(item => {
                const isPaid = item.isPaid !== undefined ? item.isPaid : true;
                let valHtml = `<input type="number" step="0.01" value="${item.value || 0}" class="bg-transparent border-none p-0 text-[0.9rem] font-black w-20 text-right focus:ring-0" onchange="updateValue(${mIdx},'${type}','${item.id}',this.value)" ${item.isCalculated || item.isSystem ? 'readonly' : ''}>`;
                if (item.isCalculated) {
                    const tot = (item.hours||0)*(item.rate||0);
                    valHtml = `<div class="flex items-center gap-1 font-black text-xs text-slate-500"><input type="number" value="${item.hours || 0}" class="bg-slate-900 rounded w-8 text-center p-0.5" onchange="updateProp(${mIdx},'income','${item.id}','hours',this.value)"><span>h = ${tot.toFixed(0)}</span></div>`;
                }
                const isExp = type === 'fixed' || type === 'variable';
                const bankLabel = item.source === 'B1' ? b1S : b2S;

                return `
                <div class="p-4 item-row ${isPaid ? 'item-paid' : 'item-unpaid'}">
                    <div class="flex items-center justify-between gap-3 mb-4">
                        <div class="flex flex-col flex-grow min-w-0">
                             <input type="text" value="${item.name}" class="main-text bg-transparent border-none text-[0.8rem] font-black w-full focus:ring-0 truncate p-0 mb-1" onchange="updateProp(${mIdx},'${type}','${item.id}','name',this.value)" ${item.isSystem?'readonly':''}>
                             <div class="flex items-center gap-2">
                                <input type="date" value="${item.date||''}" class="bg-transparent border-none p-0 text-[10px] text-slate-500 font-bold" onchange="updateProp(${mIdx},'${type}','${item.id}','date',this.value)">
                                ${isExp ? `<span class="bank-tag ${item.source==='B1'?'text-blue-400 border-blue-400/30':'text-emerald-400 border-emerald-400/30'}" onclick="toggleSource(${mIdx},'${type}','${item.id}')">${bankLabel}</span>` : ''}
                             </div>
                        </div>
                        <div class="flex items-center gap-1"><span class="text-[10px] font-black text-slate-600">R$</span>${valHtml}</div>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-white/5">
                        ${!item.isSystem ? `<div onclick="removeItem(${mIdx},'${type}','${item.id}')" class="p-2 text-slate-600 hover:text-red-500 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></div>` : '<div></div>'}
                        ${item.isPaid!==undefined && !item.isSystem ? `<label class="toggle-switch"><input type="checkbox" ${isPaid?'checked':''} onchange="togglePaid(${mIdx},'${type}','${item.id}')"><span class="slider"></span></label>`: ''}
                    </div>
                </div>`}).join('');
            lucide.createIcons();
        }

        // --- CORE ---
        function selecionarMes(idx) { activeIndex = idx; renderAll(); }
        function handleWalletEdit(mIdx, field, val) { const m = timeline[mIdx]; const nV = parseFloat(val) || 0; const sK = field === 'bank1Balance' ? 'B1' : 'B2'; const sP = [...(m.data.fixedExpensesEntries||[]), ...(m.data.variableExpensesEntries||[])].filter(x => x.isPaid && x.source === sK).reduce((s, x) => s + (x.value || 0), 0); m[field] = nV + sP; saveData(); updateStats(mIdx); }
        function updateBankName(idx, field, val) { timeline[idx][field] = val.toUpperCase() || 'BANCO'; saveData(); renderAll(); }
        function updateProp(mIdx,type,id,p,v) { const i = getL(mIdx,type).find(x=>x.id==id); if(i){ i[p]=(p==='hours'?parseFloat(v):v); saveData(); propagateBalances(); refreshUI(); } }
        function updateValue(mIdx,type,id,v) { const i = getL(mIdx,type).find(x=>x.id==id); if(i){ i.value=parseFloat(v)||0; saveData(); propagateBalances(); refreshUI(); } }
        function togglePaid(mIdx,type,id) { const i = getL(mIdx,type).find(x=>x.id==id); if(i){ i.isPaid=!i.isPaid; saveData(); refreshUI(); } }
        function toggleSource(mIdx,type,id) { const i = getL(mIdx,type).find(x=>x.id==id); if(i){ i.source = i.source === 'B1' ? 'B2' : 'B1'; saveData(); refreshUI(); } }
        function addItem(mIdx,type) { getL(mIdx,type).push({ id: Math.random(), name: 'Novo Item', value: 0, date: new Date().toISOString().slice(0,10), isPaid: false, source: 'B1' }); saveData(); propagateBalances(); refreshUI(); }
        function removeItem(mIdx,type,id) { customConfirm("Remover Item?", "Isso apagará o lançamento definitivamente.", () => { const k = type==='income'?'incomeEntries':(type==='fixed'?'fixedExpensesEntries':'variableExpensesEntries'); timeline[mIdx].data[k] = getL(mIdx,type).filter(x=>x.id!=id); saveData(); propagateBalances(); refreshUI(); }); }
        function getL(mIdx,type) { const d = timeline[mIdx].data; return type==='income'?d.incomeEntries:(type==='fixed'?d.fixedExpensesEntries:d.variableExpensesEntries); }

        function propagateBalances() {
            for (let i = 0; i < timeline.length - 1; i++) {
                const d = timeline[i].data;
                const inc = d.incomeEntries.reduce((s, x) => s + (x.isCalculated ? (x.hours * x.rate) : (x.value || 0)), 0);
                const fixT = (d.fixedExpensesEntries||[]).reduce((s, x) => s + (x.value || 0), 0);
                const varT = (d.variableExpensesEntries||[]).reduce((s, x) => s + (x.value || 0), 0);
                let nextSys = timeline[i+1].data.incomeEntries.find(x => x.isSystem || x.name === 'Saldo Mês Anterior');
                if(nextSys) nextSys.value = inc - (fixT + varT);
            }
        }

        function updateStats(mIdx) {
            const m = timeline[mIdx]; if (!m) return; const d = m.data;
            const inc = (d.incomeEntries||[]).reduce((s, x) => s + (x.isCalculated ? (x.hours * x.rate) : (x.value || 0)), 0);
            const fixP = (d.fixedExpensesEntries||[]).reduce((s, x) => s + (x.isPaid ? (x.value || 0) : 0), 0);
            const fixT = (d.fixedExpensesEntries||[]).reduce((s, x) => s + (x.value || 0), 0);
            const varP = (d.variableExpensesEntries||[]).reduce((s, x) => s + (x.isPaid ? (x.value || 0) : 0), 0);
            const varT = (d.variableExpensesEntries||[]).reduce((s, x) => s + (x.value || 0), 0);
            const totalT = fixT + varT; const totalP = fixP + varP;
            
            const elSet = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
            elSet(`stat-inc-${mIdx}`, formatBRL(inc)); elSet(`det-fix-${mIdx}`, formatBRL(fixT)); elSet(`det-var-${mIdx}`, formatBRL(varT)); elSet(`det-pend-${mIdx}`, formatBRL(totalT - totalP)); elSet(`det-tot-${mIdx}`, formatBRL(totalT));
            const elBal = document.getElementById(`stat-bal-${mIdx}`); if(elBal) { const bal = inc - totalT; elBal.textContent = formatBRL(bal); elBal.className = `text-sm font-black ${bal>=0?'text-blue-400':'text-red-400'}`; }
            const prog = totalT > 0 ? (totalP / totalT * 100).toFixed(0) : 0; const elBar = document.getElementById(`prog-paid-${mIdx}`); if(elBar) elBar.style.width = prog + '%';

            const sumPaidB1 = [...(d.fixedExpensesEntries||[]), ...(d.variableExpensesEntries||[])].filter(x => x.isPaid && x.source === 'B1').reduce((s, x) => s + (x.value || 0), 0);
            const sumPaidB2 = [...(d.fixedExpensesEntries||[]), ...(d.variableExpensesEntries||[])].filter(x => x.isPaid && x.source === 'B2').reduce((s, x) => s + (x.value || 0), 0);
            const liveB1 = (m.bank1Balance || 0) - sumPaidB1; const liveB2 = (m.bank2Balance || 0) - sumPaidB2;
            const inB1 = document.getElementById(`live-b1-${mIdx}`); const inB2 = document.getElementById(`live-b2-${mIdx}`);
            if(inB1) { inB1.value = liveB1.toFixed(2); inB1.style.color = liveB1 >= 0 ? '#10b981' : '#ef4444'; }
            if(inB2) { inB2.value = liveB2.toFixed(2); inB2.style.color = liveB2 >= 0 ? '#10b981' : '#ef4444'; }
        }

        function applyGlobalItem() {
            const n = document.getElementById('global-name').value; const v = parseFloat(document.getElementById('global-value').value) || 0; const t = document.getElementById('global-type').value; const d = document.getElementById('global-date').value; if(!n || !d) return; const day = new Date(d + 'T00:00:00').getDate();
            timeline.forEach(m => { const list = t==='income'?m.data.incomeEntries:(t==='fixed'?m.data.fixedExpensesEntries:m.data.variableExpensesEntries); let targetDate = new Date(m.year, MONTH_NAMES.indexOf(m.label), day); if (targetDate.getMonth() !== MONTH_NAMES.indexOf(m.label)) targetDate.setDate(0); list.push({ id: Math.random(), name: n, value: v, date: targetDate.toISOString().slice(0, 10), isPaid: false, source: 'B1' }); });
            saveData(); propagateBalances(); refreshUI(); closeModal('global-tool-modal');
        }

        function refreshUI() { timeline.forEach((_, idx) => { renderMonthLists(idx); updateStats(idx); }); renderTabs(); }
        function openModal(id) { document.getElementById(id).style.display='flex'; lucide.createIcons(); }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        function formatBRL(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function customConfirm(t, b, cb) { document.getElementById('confirm-body').innerText = b; const btn = document.getElementById('confirm-btn-yes'); btn.onclick = () => { closeModal('confirm-modal-overlay'); cb(); }; openModal('confirm-modal-overlay'); }
        function editAppTitle() { const n = prompt("Nome da Planilha:", "Finanças Pro"); if(n){ document.getElementById('app-display-title').innerText = n; localStorage.setItem(TITLE_KEY, n); saveData(); } }
        function downloadBackup() { const b = new Blob([JSON.stringify(timeline)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `backup_v41.json`; a.click(); }
        function handleImport(input) { const r = new FileReader(); r.onload = e => { timeline = JSON.parse(e.target.result); migrateToV41(); location.reload(); }; r.readAsText(input.files[0]); }
        function showCashFlow(idx) {
            const m = timeline[idx]; const entries = [...m.data.incomeEntries.map(i => ({ ...i, val: i.isCalculated?i.hours*i.rate:i.value, type:'IN' })), ...(m.data.fixedExpensesEntries||[]).map(i => ({ ...i, val: -i.value, type:'OUT' })), ...(m.data.variableExpensesEntries||[]).map(i => ({ ...i, val: -i.value, type:'OUT' }))].sort((a,b) => { const dA = new Date(a.date || '9999-12-31'); const dB = new Date(b.date || '9999-12-31'); if (dA - dB !== 0) return dA - dB; return a.type === 'IN' ? -1 : 1; });
            let run = 0; document.getElementById('cashflow-content').innerHTML = `<table class="w-full text-left"><thead class="sticky top-0 bg-slate-800 text-[10px] uppercase text-slate-500"><tr><th class="p-3">Data</th><th>Descr.</th><th class="text-right">Valor</th></tr></thead><tbody>${entries.map(e=>{ run+=e.val; return `<tr class="border-b border-slate-700/50 text-[11px]"><td class="p-3 text-slate-500 font-mono">${e.date?new Date(e.date+'T00:00:00').toLocaleDateString('pt-BR'):'-'}</td><td class="font-bold text-slate-300">${e.name}</td><td class="text-right font-bold ${e.type==='IN'?'text-green-400':'text-red-400'}">${formatBRL(e.val)}</td></tr>`}).join('')}</tbody></table>`;
            document.getElementById('cashflow-title').innerText = `Fluxo: ${m.label}`; openModal('cashflow-modal-overlay');
        }
        function openChartModal() { openModal('chart-modal-overlay'); setTimeout(initChart, 100); }
        function initChart() {
            const ctx = document.getElementById('globalChart'); if(!ctx) return;
            const labels = timeline.map(m => m.label);
            const incs = timeline.map(m => (m.data.incomeEntries||[]).reduce((s, x) => s + (x.isCalculated ? (x.hours * x.rate) : (x.value || 0)), 0));
            const exps = timeline.map(m => (m.data.fixedExpensesEntries||[]).reduce((s, x) => s + (x.value || 0), 0) + (m.data.variableExpensesEntries||[]).reduce((s, x) => s + (x.value || 0), 0));
            if(globalChart) globalChart.destroy();
            globalChart = new Chart(ctx.getContext('2d'), { type: 'bar', data: { labels, datasets: [{ label: 'Renda', data: incs, backgroundColor: '#3b82f6' }, { label: 'Saídas', data: exps, backgroundColor: '#ef4444' }] }, options: { responsive: true, maintainAspectRatio: false } });
        }
        function copyPrev(mIdx, type) { if (mIdx === 0) return; const k = type==='income'?'incomeEntries':(type==='fixed'?'fixedExpensesEntries':'variableExpensesEntries'); const clean = JSON.parse(JSON.stringify(timeline[mIdx-1].data[k])).filter(x=>!x.isSystem).map(x=>({...x, id:Math.random(), isPaid:false})); if(type==='income'){ const sys = timeline[mIdx].data.incomeEntries.find(x=>x.isSystem); timeline[mIdx].data.incomeEntries = [sys, ...clean]; } else { timeline[mIdx].data[k] = clean; } saveData(); propagateBalances(); refreshUI(); }
        function advanceTimeline() { customConfirm("Encerrar Mês?", "O mês mais antigo será removido da vista.", () => { timeline.shift(); if(timeline.length < 1) createInitialTimeline(); else { const last = timeline[timeline.length - 1]; let nIdx = (MONTH_NAMES.indexOf(last.label) + 1) % 12; let nYear = nIdx === 0 ? last.year + 1 : last.year; timeline.push({ label: MONTH_NAMES[nIdx], year: nYear, bank1Name: last.bank1Name, bank2Name: last.bank2Name, bank1Balance: 0, bank2Balance: 0, data: createEmptyMonthData(nIdx, nYear) }); } saveData(); propagateBalances(); location.reload(); }); }
        function addNewMonthManual() { const last = timeline[timeline.length - 1]; let nextMIdx = (MONTH_NAMES.indexOf(last.label) + 1) % 12; let nextYear = nextMIdx === 0 ? last.year + 1 : last.year; timeline.push({ label: MONTH_NAMES[nextMIdx], year: nextYear, bank1Name: last.bank1Name, bank2Name: last.bank2Name, bank1Balance: 0, bank2Balance: 0, data: createEmptyMonthData(nextMIdx, nextYear) }); propagateBalances(); activeIndex = timeline.length - 1; renderAll(); saveData(); }
        function exportCurrentMonthCSV() { const m = timeline[activeIndex]; let csv = "Tipo;Data;Descricao;Valor;Status\n"; const add = (t, l) => (l||[]).forEach(i => csv += `${t};${i.date || ''};${i.name};${i.value || 0};${i.isPaid ? 'Pago' : 'Pendente'}\n`); add('Entrada', m.data.incomeEntries); add('Fixa', m.data.fixedExpensesEntries); add('Variavel', m.data.variableExpensesEntries); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); a.download = `planilha_${m.label}.csv`; a.click(); }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
